name: Private pending-order transaction tests
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bloomscapes-pending-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database-path-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Confirm actual database path changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA"; head="$PR_HEAD_SHA" ;;
            workflow_dispatch) base="${CURRENT_SHA}^1"; head="$CURRENT_SHA" ;;
            *) echo 'DATABASE_PATH_COMPARISON_FAILED: unsupported event' >&2; exit 1 ;;
          esac
          if ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1 || ! git rev-parse --verify "$head^{commit}" >/dev/null 2>&1; then
            echo 'DATABASE_PATH_COMPARISON_FAILED: endpoint unavailable' >&2
            exit 1
          fi
          diff_file="$RUNNER_TEMP/database-paths.nul"
          if ! git diff --name-only --no-renames -z --diff-filter=ACMRD "$base" "$head" > "$diff_file"; then
            echo 'DATABASE_PATH_COMPARISON_FAILED: git diff failed' >&2
            exit 1
          fi
          mapfile -d '' -t changed_files < "$diff_file"
          changed=false
          for changed_file in "${changed_files[@]}"; do
            case "$changed_file" in supabase/*|database/*) changed=true ;; esac
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  pending-transactions:
    needs: database-path-scope
    if: needs.database-path-scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: pending_orders_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable_ci_only
      PGDATABASE: pending_orders_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-dependencies
      - name: Test isolated pending-order transactions without production access
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/ci/bloomscapes_pending_baseline.sql
          psql -v ON_ERROR_STOP=1 -f supabase/archive_migrations/20260908014335_bloomscapes_pending_orders.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bloomscapes_pending_orders_test.sql
          node scripts/run-discovered-database-tests.mjs bloomscapes-concurrency
