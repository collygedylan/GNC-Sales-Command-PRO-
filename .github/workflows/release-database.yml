name: Release isolated database and functions

on:
  workflow_call:
    inputs:
      run-schema-tests:
        description: Run schema, migration, SQL, authentication, and Realtime integration checks.
        type: boolean
        default: false
      run-browser-tests:
        description: Run database browser transaction checks.
        type: boolean
        default: false
      run-performance-tests:
        description: Run SQL and API performance benchmarks.
        type: boolean
        default: false
      run-all-schema-tests:
        description: Run full schema diagnostics even when the caller's diff is empty.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-database-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema-path-scope:
    if: inputs.run-schema-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the event change range and fail closed on comparison errors
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              head="$PUSH_AFTER_SHA"
              ;;
            workflow_dispatch)
              base="${CURRENT_SHA}^1"
              head="$CURRENT_SHA"
              ;;
            schedule)
              base="${CURRENT_SHA}^1"
              head="$CURRENT_SHA"
              ;;
            *)
              echo "Unsupported event for database path comparison: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [[ -z "$base" || -z "$head" || "$base" =~ ^0+$ || "$head" =~ ^0+$ ]]; then
            echo 'DATABASE_PATH_COMPARISON_FAILED: missing range endpoint' >&2
            exit 1
          fi
          git fetch --no-tags origin "$head" || true
          if ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1 || ! git rev-parse --verify "$head^{commit}" >/dev/null 2>&1; then
            echo 'DATABASE_PATH_COMPARISON_FAILED: endpoint unavailable' >&2
            exit 1
          fi
          diff_file="$RUNNER_TEMP/database-paths.nul"
          if ! git diff --name-only --no-renames -z --diff-filter=ACMRD "$base" "$head" > "$diff_file"; then
            echo 'DATABASE_PATH_COMPARISON_FAILED: git diff failed' >&2
            exit 1
          fi
          mapfile -d '' -t changed_files < "$diff_file"
          changed=false
          for changed_file in "${changed_files[@]}"; do
            case "$changed_file" in
              supabase/*|database/*) changed=true ;;
            esac
          done
          if [[ "${{ inputs.run-all-schema-tests }}" == 'true' ]]; then changed=true; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      pglite: ${{ steps.matrix.outputs.pglite }}
      edge: ${{ steps.matrix.outputs.edge }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: matrix
        run: node scripts/ci-backend-matrix.mjs

  integration:
    if: inputs.run-schema-tests && needs.schema-path-scope.outputs.changed == 'true'
    needs: [discover, schema-path-scope]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: true
      matrix:
        test: ${{ fromJSON(needs.discover.outputs.pglite) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-dependencies
      - name: Restore isolated PGlite modules
        id: pglite
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/gnc-handover-pglite
          key: pglite-v1-${{ runner.os }}-${{ runner.arch }}-node22-0.5.8
      - name: Install pinned PGlite
        if: steps.pglite.outputs.cache-hit != 'true'
        run: npm install --prefix "$RUNNER_TEMP/gnc-handover-pglite" --no-save --package-lock=false --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Save isolated PGlite modules
        if: steps.pglite.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/gnc-handover-pglite
          key: ${{ steps.pglite.outputs.cache-primary-key }}
      - name: Isolated SQL integration behavior
        env:
          PGLITE_TEST: ${{ matrix.test }}
        run: node "$PGLITE_TEST" --pglite-root "$RUNNER_TEMP/gnc-handover-pglite"

  edge-functions:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.discover.outputs.edge) }}
    env:
      EDGE_TARGETS: ${{ toJSON(matrix.targets) }}
      EDGE_TESTS: ${{ toJSON(matrix.tests) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        id: deno
        with:
          deno-version: v2.9.6
      - name: Restore Deno dependencies and installed NPM imports
        id: modules
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
            supabase/functions/**/node_modules
          key: deno-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.deno.outputs.deno-version }}-${{ hashFiles('deno.lock', 'package.json', 'supabase/functions/**/deno.json', 'supabase/functions/**/deno.jsonc') }}-${{ matrix.suite }}
      - name: Prefetch discovered Edge modules with bounded transient retries
        id: deno_cache
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t entrypoints < <(node -e 'for (const file of JSON.parse(process.env.EDGE_TARGETS)) console.log(file)')
          mapfile -t tests < <(node -e 'for (const file of JSON.parse(process.env.EDGE_TESTS)) console.log(file)')
          cache_log="$RUNNER_TEMP/deno-dependency-prefetch.log"
          transient_pattern='\b429[[:space:]]+Too Many Requests\b|\b5[0-9]{2}[[:space:]]+[A-Za-z][A-Za-z ]*\b|connection reset by peer|connection refused|connection timed out|timed out|unexpected EOF|temporary failure in name resolution|DNS error|failed to connect|network is unreachable|TLS handshake timeout'
          for attempt in 1 2 3; do
            if deno cache --node-modules-dir=auto "${entrypoints[@]}" "${tests[@]}" >"$cache_log" 2>&1; then
              echo "Deno dependency graph cached on attempt $attempt."
              break
            else
              status=$?
            fi
            if grep -Eiq "$transient_pattern" "$cache_log"; then
              if [ "$attempt" -lt 3 ]; then
                delay=$((attempt * 4))
                echo "Transient Deno module fetch failure; retrying cache prefetch in ${delay}s (attempt $((attempt + 1))/3)."
                sleep "$delay"
                continue
              fi
              cat "$cache_log" >&2
              echo 'Deno dependency prefetch exhausted three transient-failure attempts.' >&2
              exit "$status"
            fi
            cat "$cache_log" >&2
            echo 'Deno dependency prefetch failed for a non-retryable error.' >&2
            exit "$status"
          done
      - name: Save prefetched Deno dependency graph
        if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
            supabase/functions/**/node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - name: Run Edge Function unit tests
        id: edge
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t entrypoints < <(node -e 'for (const file of JSON.parse(process.env.EDGE_TARGETS)) console.log(file)')
          mapfile -t tests < <(node -e 'for (const file of JSON.parse(process.env.EDGE_TESTS)) console.log(file)')
          deno check --node-modules-dir=auto "${entrypoints[@]}"
          if [ "${#tests[@]}" -gt 0 ]; then
            deno test --node-modules-dir=auto --allow-env --allow-net "${tests[@]}"
          fi

  schema-gate:
    if: always() && inputs.run-schema-tests
    needs: [schema-path-scope, discover, integration, edge-functions, schema-contracts, suspend-tag-approval, database-and-functions]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require every selected backend integration check
        env:
          SCOPE: ${{ needs.schema-path-scope.outputs.changed }}
          REQUIRE_SCHEMA_SCOPE: ${{ inputs.run-all-schema-tests }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const scope = process.env.SCOPE;
          const jobs = JSON.parse(process.env.RESULTS);
          const required = ['schema-path-scope', 'discover', 'edge-functions'];
          if (scope !== 'true') {
            if (scope !== 'false' || process.env.REQUIRE_SCHEMA_SCOPE === 'true') throw new Error('BACKEND_SCHEMA_SCOPE_REQUIRED');
            console.log('No database paths changed; schema integration jobs were intentionally skipped.');
          } else {
            required.push('integration', 'schema-contracts', 'suspend-tag-approval', 'database-and-functions');
          }
          for (const name of required) {
            if (jobs[name]?.result !== 'success') throw new Error(`BACKEND_SCHEMA_GATE_FAILED_${name}`);
          }
          NODE

  schema-contracts:
    if: inputs.run-schema-tests && needs.schema-path-scope.outputs.changed == 'true'
    needs: schema-path-scope
    runs-on: ubuntu-latest
    # The timeout is a safety bound for full schema diagnostics, including the
    # opt-in performance suite; it is not the expected duration of a standard deployment.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-dependencies
      - uses: ./.github/actions/setup-supabase-images
        id: images
      - name: Replay canonical schema and verify database contracts
        env:
          # Starts local Auth, REST and gateway services for the canonical API pair.
          # Ordinary SQL and sandbox checks keep the database-only service profile.
          DATABASE_PERFORMANCE_BENCHMARK: ${{ inputs.run-performance-tests && 'true' || 'false' }}
          PERFORMANCE_API_BENCHMARK: ${{ inputs.run-performance-tests && 'true' || 'false' }}
        run: node scripts/database-check.mjs --all
      - run: node scripts/ci-supabase-image-cache.mjs save
        if: steps.images.outputs.cache-hit != 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-database-sql-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/performance
          if-no-files-found: ignore
  suspend-tag-approval:
    if: inputs.run-schema-tests && needs.schema-path-scope.outputs.changed == 'true'
    needs: schema-path-scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: suspend_tag_test
        ports: ['55439:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-dependencies
      - name: Verify Suspend Tag grants, completion, decisions, and delivery isolation
        run: node scripts/run-discovered-tests.mjs postgres-runtime
  database-and-functions:
    if: inputs.run-schema-tests && needs.schema-path-scope.outputs.changed == 'true'
    needs: schema-path-scope
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: dependencies
        uses: ./.github/actions/setup-node-dependencies
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Restore pinned CLI registry fallback
        id: registry
        shell: bash
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-supabase-images
        id: images
      - name: Prepare isolated migration project
        id: prepare
        run: node scripts/historical-database-fixture.mjs "$RUNNER_TEMP/gnc-supabase-ci"
      - name: Start isolated Supabase stack
        id: stack
        run: node scripts/release-database-startup.mjs start
      - run: node scripts/ci-supabase-image-cache.mjs save
        if: steps.images.outputs.cache-hit != 'true'
      - name: Apply migrations and strictly lint the isolated database
        id: migrations
        run: node scripts/sql-lint-temp-context.mjs --historical-reset "$SUPABASE_CI_ROOT"
      - name: Run pgTAP and RLS tests
        id: sql
        run: supabase --workdir "$SUPABASE_CI_ROOT" test db
      - name: Run PostgreSQL concurrency transactions
        if: inputs.run-schema-tests
        shell: bash
        run: |
          set -euo pipefail
          supabase --workdir "$SUPABASE_CI_ROOT" status -o env > "$RUNNER_TEMP/supabase-status.env"
          set -a
          source "$RUNNER_TEMP/supabase-status.env"
          set +a
          node scripts/run-discovered-database-tests.mjs postgres-concurrency "$DB_URL"
      - id: browser_setup
        if: inputs.run-browser-tests
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - name: Run browser request transactions against local Supabase
        id: transactions
        if: inputs.run-browser-tests
        shell: bash
        run: |
          set -euo pipefail
          supabase --workdir "$SUPABASE_CI_ROOT" status -o env > "$RUNNER_TEMP/supabase-status.env"
          set -a
          source "$RUNNER_TEMP/supabase-status.env"
          set +a
          SUPABASE_LOCAL_URL="$API_URL" \
          SUPABASE_LOCAL_ANON_KEY="$ANON_KEY" \
          SUPABASE_LOCAL_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          SUPABASE_LOCAL_DB_URL="$DB_URL" \
          npx playwright test --config playwright.database.config.ts --project=chromium --workers=1 --max-failures=1
      - name: Run native authentication smoke tests against loopback Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase --workdir "$SUPABASE_CI_ROOT" status --output env > "$RUNNER_TEMP/supabase-status.env"
          set -a
          source "$RUNNER_TEMP/supabase-status.env"
          set +a
          local_env_file="$RUNNER_TEMP/local-app-api.env"
          printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\nAPP_SESSION_SECRET=%s\n' \
            "$API_URL" "$SERVICE_ROLE_KEY" "$(openssl rand -hex 32)" > "$local_env_file"
          supabase --workdir "$SUPABASE_CI_ROOT" functions serve --env-file "$local_env_file" --no-verify-jwt > "$RUNNER_TEMP/local-functions.log" 2>&1 &
          functions_pid=$!
          cleanup_functions() {
            kill "$functions_pid" 2>/dev/null || true
            wait "$functions_pid" 2>/dev/null || true
            rm -f "$local_env_file" "$RUNNER_TEMP/supabase-status.env"
          }
          trap cleanup_functions EXIT
          ready=false
          for attempt in $(seq 1 60); do
            status=$(curl --silent --show-error --max-time 2 -o /dev/null -w '%{http_code}' \
              -X POST "$API_URL/functions/v1/app-api" -H 'Content-Type: application/json' -d '{}' 2>/dev/null || true)
            case "$status" in
              400|401|403|405|422) ready=true; break ;;
            esac
            if ! kill -0 "$functions_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/local-functions.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/local-functions.log"
            echo 'Local app-api function did not become ready on loopback.' >&2
            exit 1
          fi
          SUPABASE_URL="$API_URL" \
          SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          EXPECTED_PROJECT_REF=local \
          node scripts/run-discovered-tests.mjs local-auth-smoke
      - name: Save relation-size report query
        run: |
          mkdir -p artifacts
          cp scripts/report-database-bloat.sql artifacts/report-database-bloat.sql
          cp scripts/report-unused-table-candidates.sql artifacts/report-unused-table-candidates.sql
          cp scripts/report-rls-policies.sql artifacts/report-rls-policies.sql
          cp scripts/report-secret-bearing-functions.sql artifacts/report-secret-bearing-functions.sql
          cp scripts/report-drive-around-compaction-parity.sql artifacts/report-drive-around-compaction-parity.sql
          cp scripts/report-app-live-events-retirement.sql artifacts/report-app-live-events-retirement.sql
      - name: Record sanitized database stage and image evidence
        if: always()
        env:
          DATABASE_STEPS: ${{ toJSON(steps) }}
        run: node scripts/release-database-startup.mjs evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-database-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts
            playwright-report/database
            test-results/database
          if-no-files-found: ignore
