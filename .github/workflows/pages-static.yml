name: Deploy static app to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build v2 beta app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check:inline
          npm run test:pilot
          npx playwright install --with-deps chromium
          npm run test:v2:e2e
          npm run build:pilot-monitoring
          npm run build:live:assets
          npm run build:v2

      - name: Prepare static app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/index.html
          cp manifest.json _site/manifest.json
          cp sw.js _site/sw.js
          cp CNAME _site/CNAME
          cp .nojekyll _site/.nojekyll
          cp OneSignalSDKWorker.js _site/OneSignalSDKWorker.js
          cp -r assets _site/assets
          cp ag-data-solutions-logo-v2026080923.png _site/ag-data-solutions-logo-v2026080923.png
          cp ag-data-solutions-splash-v2026080923.png _site/ag-data-solutions-splash-v2026080923.png
          cp ag-data-solutions-icon-v2026080923-32.png _site/ag-data-solutions-icon-v2026080923-32.png
          cp ag-data-solutions-icon-v2026080923-180.png _site/ag-data-solutions-icon-v2026080923-180.png
          cp ag-data-solutions-icon-v2026080923-192.png _site/ag-data-solutions-icon-v2026080923-192.png
          cp ag-data-solutions-icon-v2026080923-512.png _site/ag-data-solutions-icon-v2026080923-512.png
          cp ag-data-solutions-logo-v2026080925.png _site/ag-data-solutions-logo-v2026080925.png
          cp ag-data-solutions-splash-v2026080925.png _site/ag-data-solutions-splash-v2026080925.png
          cp ag-data-solutions-icon-v2026080925-32.png _site/ag-data-solutions-icon-v2026080925-32.png
          cp ag-data-solutions-icon-v2026080925-180.png _site/ag-data-solutions-icon-v2026080925-180.png
          cp ag-data-solutions-icon-v2026080925-192.png _site/ag-data-solutions-icon-v2026080925-192.png
          cp ag-data-solutions-icon-v2026080925-512.png _site/ag-data-solutions-icon-v2026080925-512.png
          mkdir -p _site/v2
          cp -r v2/dist/* _site/v2/
          npm run build:live:shell
          test "$(wc -c < _site/index.html)" -le 1500000
          ! grep -Eq 'cdn\.tailwindcss\.com|unpkg\.com/@phosphor-icons|cdn\.jsdelivr\.net/npm/@supabase' _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
