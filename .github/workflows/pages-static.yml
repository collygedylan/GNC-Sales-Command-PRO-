name: Deploy static app to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected-commit:
        description: Expected current main commit; empty selects this run's main SHA.
        type: string
        required: false
        default: ''
      base-commit:
        description: Optional deployed main commit for explicit recovery, including Apps Script version-cap fallback.
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read
  pull-requests: read

# One current-main coordinator sequences mixed releases and skips deployment for tooling-only changes.
concurrency:
  group: pages-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fast-gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      supabase: ${{ steps.classify.outputs.supabase }}
      apps-script: ${{ steps.classify.outputs.apps-script }}
      tooling-only: ${{ steps.classify.outputs.tooling-only }}
      migrations: ${{ steps.classify.outputs.migrations }}
      edge-functions: ${{ steps.classify.outputs.edge-functions }}
      digest: ${{ steps.seal.outputs.digest }}
      site-id: ${{ steps.site.outputs.artifact-id }}
      run-id: ${{ github.run_id }}
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Require the requested current main commit
        uses: actions/github-script@v7
        env:
          EXPECTED_COMMIT: ${{ inputs.expected-commit }}
        with:
          script: |
            const expected = process.env.EXPECTED_COMMIT || context.sha;
            if (!/^[a-f0-9]{40}$/.test(expected) || expected !== context.sha) {
              throw new Error('FRONTEND_EXPECTED_COMMIT_MISMATCH');
            }
            const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            if (main.object.sha !== context.sha) throw new Error('FRONTEND_MAIN_SUPERSEDED');
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify direct scope once; tooling never recovers runtime deployments
        id: classify
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          MANUAL_BASE: ${{ inputs.base-commit }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { findLastSuccessfulDeploymentBaseline } from './scripts/release-baseline.mjs';
          import { fetchGitHubJson } from './scripts/lib/github-json-transport.mjs';
          import { changedReleasePaths, classifyReleasePaths, isSafePackageMetadataChange, selectReleaseRecoveryBase } from './scripts/release-scope.mjs';
          const commit = process.env.RELEASE_COMMIT;
          let before = process.env.EVENT_BEFORE || process.env.MANUAL_BASE || '';
          if (!before || /^0+$/.test(before)) {
            try { before = execFileSync('git', ['rev-parse', `${commit}^1`], { encoding: 'utf8' }).trim(); }
            catch { before = '0'.repeat(40); }
          }
          let paths = /^0+$/.test(before)
            ? execFileSync('git', ['diff-tree', '--root', '--no-commit-id', '--name-only', '-r', commit], { encoding: 'utf8' }).trim().split(/\r?\n/).filter(Boolean)
            : changedReleasePaths({ before, after: commit });
          const packageMetadataSafe = base => {
            if (!paths.some(file => file === 'package.json' || file === 'package-lock.json')) return false;
            try {
              const readPackage = revision => JSON.parse(execFileSync('git', ['show', `${revision}:package.json`], { encoding: 'utf8' }));
              let safe = isSafePackageMetadataChange(readPackage(base), readPackage(commit));
              if (paths.includes('package-lock.json')) {
                const readLock = revision => execFileSync('git', ['show', `${revision}:package-lock.json`], { encoding: 'utf8' });
                safe &&= readLock(base) === readLock(commit);
              }
              return safe;
            } catch { return false; }
          };
          const isAncestor = (ancestor, descendant) => {
            try { execFileSync('git', ['merge-base', '--is-ancestor', ancestor, descendant]); return true; }
            catch { return false; }
          };
          const initialScope = classifyReleasePaths(paths, { packageMetadataOnly: packageMetadataSafe(before) });
          // Resolve only selected deployment domains. A tooling push performs no history scan.
          const recover = async publication => {
            const lastSuccessfulBase = await findLastSuccessfulDeploymentBaseline({
              repository: process.env.GITHUB_REPOSITORY, currentRunId: Number(process.env.GITHUB_RUN_ID),
              currentSha: commit, publication,
              api: endpoint => fetchGitHubJson({ endpoint, token: process.env.GITHUB_TOKEN }),
            });
            const recoveryBase = selectReleaseRecoveryBase({ scope: initialScope,
              manualBase: process.env.MANUAL_BASE || before, lastSuccessfulBase, isAncestor });
            if (!recoveryBase || /^0+$/.test(recoveryBase)) return initialScope;
            execFileSync('git', ['merge-base', '--is-ancestor', recoveryBase, commit]);
            const recoveryPaths = changedReleasePaths({ before: recoveryBase, after: commit });
            return classifyReleasePaths(recoveryPaths);
          };
          // Recovery is part of this exact run. Never replay an already-published domain.
          const frontendScope = initialScope.deploy.frontend ? await recover('frontend') : initialScope;
          const backendScope = initialScope.deploy.supabase || initialScope.deploy.appsScript
            ? await recover('backend') : initialScope;
          const scope = { ...initialScope, deploy: {
            frontend: initialScope.deploy.frontend && frontendScope.deploy.frontend,
            supabase: initialScope.deploy.supabase && backendScope.deploy.supabase,
            appsScript: initialScope.deploy.appsScript && backendScope.deploy.appsScript,
          }, migrations: initialScope.deploy.supabase ? backendScope.migrations : [],
             edgeFunctions: initialScope.deploy.supabase ? backendScope.edgeFunctions : [] };
          appendFileSync(process.env.GITHUB_OUTPUT,
            `frontend=${scope.deploy.frontend}\nsupabase=${scope.deploy.supabase}\napps-script=${scope.deploy.appsScript}\ntooling-only=${scope.toolingOnly}\nmigrations=${JSON.stringify(scope.migrations)}\n`);
          let edgeFunctions = scope.edgeFunctions;
          if (edgeFunctions.includes('*')) {
            const tracked = execFileSync('git', ['ls-tree', '-r', '--name-only', commit, 'supabase/functions'], { encoding: 'utf8' });
            edgeFunctions = [...new Set(tracked.split(/\r?\n/).map(file => /^supabase\/functions\/([^/]+)\//.exec(file)?.[1])
              .filter(name => name && name !== '_shared'))].sort();
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `edge-functions=${JSON.stringify(edgeFunctions)}\n`);
          console.log(`Changed ${paths.length} paths; frontend=${scope.deploy.frontend}, supabase=${scope.deploy.supabase}, apps-script=${scope.deploy.appsScript}, tooling-only=${scope.toolingOnly}.`);
          NODE
      - uses: ./.github/actions/setup-node-dependencies
      - name: Check inline JavaScript
        run: npm run check:inline
      - name: Focused release contracts only (15 second budget)
        run: node scripts/run-tooling-release-checks.mjs
      - name: Type-check only selected Edge Functions
        if: steps.classify.outputs.edge-functions != '[]'
        env:
          RELEASE_EDGE_FUNCTIONS: ${{ steps.classify.outputs.edge-functions }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          for (const name of JSON.parse(process.env.RELEASE_EDGE_FUNCTIONS)) {
            if (!/^[a-z][a-z0-9-]*$/.test(name)) throw new Error('RELEASE_EDGE_NAME_INVALID');
            const result = spawnSync('./node_modules/.bin/deno', ['check', '--node-modules-dir=none', '--frozen',
              `supabase/functions/${name}/index.ts`], { stdio: 'inherit' });
            if (result.error || result.status !== 0) throw new Error(`RELEASE_DENO_CHECK_FAILED_${name}`);
          }
          NODE
      - uses: ./.github/actions/prepare-native-release
        if: steps.classify.outputs.frontend == 'true'
      - id: seal
        if: steps.classify.outputs.frontend == 'true'
        run: node scripts/release-artifact.mjs seal
      - id: site
        if: steps.classify.outputs.frontend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-site-${{ github.sha }}
          path: _site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Record selected fast checks
        run: echo 'Fast gate passed; full Node shards, SQL suites, browsers and Docker builds were not selected.' >> "$GITHUB_STEP_SUMMARY"

  backend-publication:
    if: >-
      !cancelled() && needs.fast-gate.result == 'success' &&
      (needs.fast-gate.outputs.supabase == 'true' || needs.fast-gate.outputs['apps-script'] == 'true')
    needs: [fast-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch and verify the exact backend release
        uses: actions/github-script@v7
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          COORDINATOR_RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUIRE_SUPABASE: ${{ needs.fast-gate.outputs.supabase }}
          REQUIRE_APPS_SCRIPT: ${{ needs.fast-gate.outputs['apps-script'] }}
          RELEASE_MIGRATIONS: ${{ needs.fast-gate.outputs.migrations }}
          RELEASE_EDGE_FUNCTIONS: ${{ needs.fast-gate.outputs['edge-functions'] }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = process.env.EXPECTED_COMMIT;
            const repository = `${owner}/${repo}`;
            const { data: main } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (main.object.sha !== sha) throw new Error('BACKEND_MAIN_SUPERSEDED');
            const { data: workflow } = await github.rest.actions.getWorkflow({ owner, repo, workflow_id: 'apps-script-sync.yml' });
            if (workflow.path !== '.github/workflows/apps-script-sync.yml' || workflow.state !== 'active') {
              throw new Error('BACKEND_WORKFLOW_INVALID');
            }
            const existing = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: workflow.id, head_sha: sha, per_page: 100,
            });
            let run = existing.filter(candidate => candidate.path === workflow.path && candidate.head_branch === 'main'
              && candidate.head_sha === sha && candidate.event === 'workflow_dispatch'
              && candidate.head_repository?.full_name === repository
              && (candidate.status !== 'completed' || candidate.conclusion === 'success'))
              .sort((a, b) => b.run_number - a.run_number)[0];
            if (!run) {
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: workflow.id, ref: 'main',
                inputs: { 'expected-commit': sha, migrations: process.env.RELEASE_MIGRATIONS,
                  'edge-functions': process.env.RELEASE_EDGE_FUNCTIONS,
                  'supabase-changed': process.env.REQUIRE_SUPABASE } });
              const old = new Set(existing.map(candidate => candidate.id));
              const deadline = Date.now() + 30 * 60 * 1000;
              while (Date.now() < deadline && !run) {
                const candidates = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner, repo, workflow_id: workflow.id, head_sha: sha, per_page: 100,
                });
                run = candidates.find(candidate => !old.has(candidate.id) && candidate.path === workflow.path
                  && candidate.head_branch === 'main' && candidate.head_sha === sha
                  && candidate.event === 'workflow_dispatch' && candidate.head_repository?.full_name === repository);
                if (!run) await new Promise(resolve => setTimeout(resolve, 5000));
              }
            }
            const deadline = Date.now() + 30 * 60 * 1000;
            while (run && Date.now() < deadline) {
              const { data: current } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id });
                if (current.id !== run.id || current.workflow_id !== workflow.id || current.path !== workflow.path
                    || current.event !== 'workflow_dispatch' || current.head_sha !== sha
                    || current.head_repository?.full_name !== repository || !Number.isSafeInteger(current.run_attempt)
                    || current.run_attempt < 1) throw new Error('BACKEND_RUN_IDENTITY_MISMATCH');
              if (current.status === 'completed') {
                if (current.conclusion !== 'success') throw new Error(`BACKEND_RUN_FAILED:${current.conclusion}`);
                  const { data: jobs } = await github.rest.actions.listJobsForWorkflowRunAttempt({ owner, repo,
                    run_id: current.id, attempt_number: current.run_attempt, per_page: 100 });
                  const deploy = (jobs.jobs || []).filter(job => job.name === 'Apply backend migrations and deploy Edge Functions'
                    && job.run_id === current.id && job.head_sha === sha && job.status === 'completed');
                  if (deploy.length !== 1 || (process.env.REQUIRE_SUPABASE === 'true'
                    ? deploy[0].conclusion !== 'success'
                    : !['success', 'skipped'].includes(deploy[0].conclusion))) {
                    throw new Error('BACKEND_DEPLOY_JOB_NOT_SUCCESSFUL');
                  }
                if (process.env.REQUIRE_APPS_SCRIPT === 'true') {
                  const { data: scriptWorkflow } = await github.rest.actions.getWorkflow({ owner, repo, workflow_id: 'apps-script-deploy.yml' });
                  if (scriptWorkflow.path !== '.github/workflows/apps-script-deploy.yml' || scriptWorkflow.state !== 'active') {
                    throw new Error('APPS_SCRIPT_WORKFLOW_INVALID');
                  }
                  const beforeScriptRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                    owner, repo, workflow_id: scriptWorkflow.id, head_sha: sha, per_page: 100,
                  });
                  let scriptRun = beforeScriptRuns.filter(candidate => candidate.workflow_id === scriptWorkflow.id
                    && candidate.path === scriptWorkflow.path && candidate.head_branch === 'main' && candidate.head_sha === sha
                    && candidate.event === 'workflow_dispatch' && candidate.head_repository?.full_name === repository
                    && (candidate.status !== 'completed' || candidate.conclusion === 'success'))
                    .sort((a, b) => b.run_number - a.run_number)[0];
                  const oldScriptRuns = new Set(beforeScriptRuns.map(candidate => candidate.id));
                  if (!scriptRun) {
                    await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: scriptWorkflow.id, ref: 'main',
                      inputs: { 'expected-commit': sha, 'backend-run-id': String(current.id),
                      'backend-run-attempt': String(current.run_attempt), 'coordinator-run-id': String(context.runId),
                      'coordinator-run-attempt': process.env.COORDINATOR_RUN_ATTEMPT,
                      'supabase-required': process.env.REQUIRE_SUPABASE,
                      'script-changed': process.env.REQUIRE_APPS_SCRIPT } });
                  }
                  const scriptDeadline = Date.now() + 15 * 60 * 1000;
                  while (Date.now() < scriptDeadline) {
                    if (!scriptRun) {
                      const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                        owner, repo, workflow_id: scriptWorkflow.id, head_sha: sha, per_page: 100,
                      });
                      scriptRun = runs.find(candidate => !oldScriptRuns.has(candidate.id)
                        && candidate.workflow_id === scriptWorkflow.id && candidate.path === scriptWorkflow.path
                        && candidate.head_branch === 'main' && candidate.head_sha === sha && candidate.event === 'workflow_dispatch'
                        && candidate.head_repository?.full_name === repository);
                    }
                    if (scriptRun) {
                      const { data: currentScriptRun } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: scriptRun.id });
                      if (currentScriptRun.id !== scriptRun.id || currentScriptRun.workflow_id !== scriptWorkflow.id
                        || currentScriptRun.path !== scriptWorkflow.path || currentScriptRun.event !== 'workflow_dispatch'
                        || currentScriptRun.head_branch !== 'main' || currentScriptRun.head_sha !== sha
                        || currentScriptRun.head_repository?.full_name !== repository
                        || !Number.isSafeInteger(currentScriptRun.run_attempt) || currentScriptRun.run_attempt < 1) {
                        throw new Error('APPS_SCRIPT_RUN_IDENTITY_MISMATCH');
                      }
                      scriptRun = currentScriptRun;
                      if (scriptRun.status === 'completed') break;
                    }
                    await new Promise(resolve => setTimeout(resolve, 5000));
                  }
                  if (!scriptRun || scriptRun.status !== 'completed' || scriptRun.conclusion !== 'success'
                    || scriptRun.head_sha !== sha || scriptRun.head_repository?.full_name !== repository) {
                    throw new Error('APPS_SCRIPT_PUBLICATION_NOT_SUCCESSFUL');
                  }
                  const { data: scriptJobs } = await github.rest.actions.listJobsForWorkflowRunAttempt({ owner, repo,
                    run_id: scriptRun.id, attempt_number: scriptRun.run_attempt, per_page: 100 });
                  const publish = (scriptJobs.jobs || []).filter(job => job.name === 'deploy-apps-script'
                    && job.run_id === scriptRun.id && job.head_sha === sha);
                  const publishStep = publish.length === 1 ? (publish[0].steps || []).filter(step => step.name === 'Publish the guarded production Apps Script version') : [];
                  if (publish.length !== 1 || publish[0].status !== 'completed' || publish[0].conclusion !== 'success'
                    || publishStep.length !== 1 || publishStep[0].conclusion !== 'success') {
                    throw new Error('APPS_SCRIPT_PUBLISH_STEP_NOT_SUCCESSFUL');
                  }
                }
                const { data: latestMain } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
                if (latestMain.object.sha !== sha) throw new Error('BACKEND_MAIN_SUPERSEDED_DURING_DEPLOY');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
              run = current;
            }
            throw new Error('BACKEND_PUBLICATION_TIMEOUT');

  deploy:
    needs: [fast-gate, backend-publication]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.fast-gate.outputs.frontend == 'true' &&
      needs.fast-gate.result == 'success' &&
      (((needs.fast-gate.outputs.supabase == 'true' || needs.fast-gate.outputs['apps-script'] == 'true') &&
        needs.backend-publication.result == 'success') ||
       (needs.fast-gate.outputs.supabase != 'true' && needs.fast-gate.outputs['apps-script'] != 'true' &&
        needs.backend-publication.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
      pages: write
    environment:
      name: github-pages
      url: https://agmetricapp.com/
    outputs:
      build-commit: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.fast-gate.outputs.digest }}
          run-id: ${{ github.run_id }}
          artifact-id: ${{ needs.fast-gate.outputs.site-id }}
          token: ${{ github.token }}
          commit: ${{ github.sha }}
      - name: Reject a stale main commit immediately before publication
        uses: actions/github-script@v7
        env:
          EXPECTED_COMMIT: ${{ inputs.expected-commit }}
          VALIDATED_RUN_ID: ${{ needs.fast-gate.outputs.run-id }}
          VALIDATED_ATTEMPT: ${{ needs.fast-gate.outputs.attempt }}
        with:
          script: |
            const expected = process.env.EXPECTED_COMMIT || context.sha;
            if (expected !== context.sha || process.env.VALIDATED_RUN_ID !== String(context.runId)
                || process.env.VALIDATED_ATTEMPT !== process.env.GITHUB_RUN_ATTEMPT) {
              throw new Error('FRONTEND_VALIDATION_IDENTITY_MISMATCH');
            }
            const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            if (main.object.sha !== context.sha) throw new Error('FRONTEND_MAIN_SUPERSEDED');
      - name: Write the verified publication descriptor
        env:
          RELEASE_BUILD_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p artifacts/pages-publication
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('artifacts/pages-publication/publication.json', JSON.stringify({
            schemaVersion: 'gnc-pages-publication-v1',
            repository: process.env.GITHUB_REPOSITORY,
            commit: process.env.GITHUB_SHA,
            buildCommit: process.env.RELEASE_BUILD_COMMIT,
            runId: Number(process.env.GITHUB_RUN_ID),
            attempt: Number(process.env.GITHUB_RUN_ATTEMPT)
          }));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pages-publication-${{ github.run_attempt }}
          path: artifacts/pages-publication/publication.json
          if-no-files-found: error
          retention-days: 7
      - name: Deploy verified artifact to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repository="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch "$repository" gh-pages:refs/remotes/origin/gh-pages
          pages_dir="$RUNNER_TEMP/gnc-gh-pages"
          git worktree add --detach "$pages_dir" refs/remotes/origin/gh-pages
          rsync -a --delete --exclude='.git' _site/ "$pages_dir/"
          test -f "$pages_dir/CNAME"
          test -f "$pages_dir/.nojekyll"
          git -C "$pages_dir" add -A
          if git -C "$pages_dir" diff --cached --quiet; then
            echo 'GHPAGES_ALREADY_CURRENT'
            exit 0
          fi
          git -C "$pages_dir" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish ${GITHUB_SHA:0:12} to GitHub Pages"
          git -C "$pages_dir" push "$repository" HEAD:gh-pages
      # GITHUB_TOKEN branch pushes do not automatically start a Pages build.
      - name: Request the GitHub Pages build for the published branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'

  exact-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the current live descriptor and immutable fingerprint
        env:
          CANARY_BASE_URL: https://agmetricapp.com
          EXPECTED_COMMIT: ${{ needs.deploy.outputs.build-commit }}
          REQUIRE_CURRENT_LIVE_DESCRIPTOR: '1'
          CANARY_WAIT_TIMEOUT_MS: '600000'
          CANARY_WAIT_INTERVAL_MS: '5000'
        run: node scripts/wait-for-live-release.mjs
      - name: Verify live access-code and native session login
        env:
          PRODUCTION_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/probe-production-login.mjs
      - name: Report the verified live version
        run: |
          version=$(node --input-type=module -e "import { readExpectedRelease } from './scripts/deployment-fingerprint-lib.mjs'; console.log(await readExpectedRelease());")
          echo "${version} is now LIVE"
          echo "${version} is now LIVE" >> "$GITHUB_STEP_SUMMARY"
