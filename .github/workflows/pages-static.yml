name: Deploy static app to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

# Do not cancel a release mid-publish or while exact-live checks are running.
# Feature-branch validation can run independently; checks within a release fan out.
concurrency:
  group: pages-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.select.outputs.reuse }}
      run-id: ${{ steps.select.outputs.run-id }}
      attempt: ${{ steps.select.outputs.attempt }}
      site-id: ${{ steps.select.outputs.site-id }}
      proof-id: ${{ steps.select.outputs.proof-id }}
      build-commit: ${{ steps.select.outputs.build-commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select a successful matching PR candidate, or require a fresh main validation
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/pages-release.mjs select

  candidate-validation:
    needs: select-candidate
    if: github.ref == 'refs/heads/main' && needs.select-candidate.outputs.reuse != 'true'
    uses: ./.github/workflows/release-validation.yml
    with:
      production-health: true
    secrets: inherit

  validation:
    needs: [select-candidate, candidate-validation]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.select-candidate.result == 'success' &&
      (needs.select-candidate.outputs.reuse == 'true' || needs.candidate-validation.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
      run-id: ${{ steps.verify.outputs.run-id }}
      attempt: ${{ steps.verify.outputs.attempt }}
      site-id: ${{ steps.verify.outputs.site-id }}
      proof-id: ${{ steps.verify.outputs.proof-id }}
      build-commit: ${{ steps.verify.outputs.build-commit }}
      reuse: ${{ needs.select-candidate.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.select-candidate.outputs.reuse == 'true' && needs.select-candidate.outputs.proof-id || needs.candidate-validation.outputs.proof-id }}
          run-id: ${{ needs.select-candidate.outputs.reuse == 'true' && needs.select-candidate.outputs.run-id || needs.candidate-validation.outputs.run-id }}
          github-token: ${{ github.token }}
          path: artifacts/candidate-proof
          merge-multiple: true
      - name: Verify candidate commit, run, attempt, version and digest
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_REUSE: ${{ needs.select-candidate.outputs.reuse }}
          RELEASE_BUILD_COMMIT: ${{ needs.select-candidate.outputs.reuse == 'true' && needs.select-candidate.outputs.build-commit || github.sha }}
          RELEASE_PROOF_RUN_ID: ${{ needs.select-candidate.outputs.reuse == 'true' && needs.select-candidate.outputs.run-id || needs.candidate-validation.outputs.run-id }}
          RELEASE_PROOF_ATTEMPT: ${{ needs.select-candidate.outputs.reuse == 'true' && needs.select-candidate.outputs.attempt || needs.candidate-validation.outputs.attempt }}
          RELEASE_PROOF_SITE_ID: ${{ needs.select-candidate.outputs.reuse == 'true' && needs.select-candidate.outputs.site-id || needs.candidate-validation.outputs.site-id }}
          RELEASE_PROOF_ID: ${{ needs.select-candidate.outputs.reuse == 'true' && needs.select-candidate.outputs.proof-id || needs.candidate-validation.outputs.proof-id }}
          RELEASE_PROOF_DIGEST: ${{ needs.candidate-validation.outputs.digest }}
        run: node scripts/pages-release.mjs verify
      - name: Require compatible Apps Script before frontend publication
        env:
          GH_TOKEN: ${{ github.token }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          APPS_SCRIPT_COMPATIBILITY_ATTEMPTS: '49'
          APPS_SCRIPT_COMPATIBILITY_INTERVAL_MS: '5000'
          APPS_SCRIPT_COMPATIBILITY_TIMEOUT_MS: '240000'
        run: node scripts/check-compatible-apps-script.mjs
      - name: Probe production login bridge and Data API
        env:
          PRODUCTION_PROBE_READ_ONLY: '1'
          PRODUCTION_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUEST_DELIVERY_CRON_SECRET: ${{ secrets.REQUEST_DELIVERY_CRON_SECRET }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          REQUIRE_APPS_SCRIPT_HEALTH: '1'
          REQUIRE_BOUNDED_MAINTENANCE: '1'
        run: node scripts/probe-production-auth-health.mjs

  deploy:
    needs: validation
    # Candidate reuse skips an ancestor job. Override implicit success() while
    # still requiring verified validation and respecting cancellation.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.validation.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      pull-requests: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      published: ${{ steps.current.outputs.publish }}
      build-commit: ${{ needs.validation.outputs.build-commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject a superseded candidate before publication
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            const ref = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            const publish = ref.data.object.sha === context.sha;
            core.setOutput('publish', String(publish));
            if (!publish) core.notice('SUPERSEDED_RELEASE: a newer main commit must finish its own checks.');
      - uses: actions/download-artifact@v4
        if: steps.current.outputs.publish == 'true'
        with:
          artifact-ids: ${{ needs.validation.outputs.proof-id }}
          run-id: ${{ needs.validation.outputs.run-id }}
          github-token: ${{ github.token }}
          path: artifacts/candidate-proof
          merge-multiple: true
      - name: Recheck candidate proof immediately before artifact publication
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_REUSE: ${{ needs.validation.outputs.reuse }}
          RELEASE_BUILD_COMMIT: ${{ needs.validation.outputs.build-commit }}
          RELEASE_PROOF_RUN_ID: ${{ needs.validation.outputs.run-id }}
          RELEASE_PROOF_ATTEMPT: ${{ needs.validation.outputs.attempt }}
          RELEASE_PROOF_SITE_ID: ${{ needs.validation.outputs.site-id }}
          RELEASE_PROOF_ID: ${{ needs.validation.outputs.proof-id }}
          RELEASE_PROOF_DIGEST: ${{ needs.validation.outputs.digest }}
        run: node scripts/pages-release.mjs verify
      - uses: ./.github/actions/download-release
        if: steps.current.outputs.publish == 'true'
        with:
          digest: ${{ needs.validation.outputs.digest }}
          run-id: ${{ needs.validation.outputs.run-id }}
          artifact-id: ${{ needs.validation.outputs.site-id }}
          token: ${{ github.token }}
          commit: ${{ needs.validation.outputs.build-commit }}
      - name: Write the verified publication descriptor
        if: steps.current.outputs.publish == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_BUILD_COMMIT: ${{ needs.validation.outputs.build-commit }}
        run: |
          mkdir -p artifacts/pages-publication
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('artifacts/pages-publication/publication.json', JSON.stringify({
            schemaVersion: 'gnc-pages-publication-v1',
            repository: process.env.GITHUB_REPOSITORY,
            commit: process.env.GITHUB_SHA,
            buildCommit: process.env.RELEASE_BUILD_COMMIT,
            runId: Number(process.env.GITHUB_RUN_ID),
            attempt: Number(process.env.GITHUB_RUN_ATTEMPT)
          }));
          NODE
      - uses: actions/upload-artifact@v4
        if: steps.current.outputs.publish == 'true'
        with:
          name: pages-publication-${{ github.run_attempt }}
          path: artifacts/pages-publication/publication.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/configure-pages@v5
        if: steps.current.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.current.outputs.publish == 'true'
        with:
          path: _site
      - name: Deploy verified artifact to Pages
        id: deployment
        if: steps.current.outputs.publish == 'true'
        uses: actions/deploy-pages@v4

  exact-live:
    needs: deploy
    if: >-
      !cancelled() && needs.deploy.result == 'success' &&
      needs.deploy.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for exact live release and commit
        env:
          CANARY_BASE_URL: https://agmetricapp.com
          EXPECTED_COMMIT: ${{ needs.deploy.outputs.build-commit }}
          CANARY_WAIT_TIMEOUT_MS: '240000'
          CANARY_WAIT_INTERVAL_MS: '5000'
        run: node scripts/wait-for-live-release.mjs

  post-deployment-canary:
    needs: [deploy, exact-live]
    if: >-
      !cancelled() && needs.deploy.result == 'success' &&
      needs.deploy.outputs.published == 'true' && needs.exact-live.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: true
      matrix:
        include:
          - suite: foundation
            project: lifecycle-chromium
            browsers: chromium
            command: 'npm run test:foundation -- --reporter=github --project=lifecycle-chromium --workers=1 --max-failures=1'
          - suite: foundation
            project: lifecycle-iphone
            browsers: webkit
            command: 'npm run test:foundation -- --reporter=github --project=lifecycle-iphone --workers=1 --max-failures=1'
          - suite: requests
            project: production-chromium
            browsers: chromium
            command: npx playwright test --config playwright.production.config.ts --project=production-chromium --workers=1 --max-failures=1
          - suite: requests
            project: production-iphone-webkit
            browsers: webkit
            command: npx playwright test --config playwright.production.config.ts --project=production-iphone-webkit --workers=1 --max-failures=1
          - suite: session
            project: session-chromium
            browsers: chromium
            command: 'npm run test:session-recovery -- --project=session-chromium --workers=1 --max-failures=1'
          - suite: session
            project: session-iphone
            browsers: webkit
            command: 'npm run test:session-recovery -- --project=session-iphone --workers=1 --max-failures=1'
          - suite: login-photo
            project: chromium
            browsers: chromium
            command: npx playwright test --config playwright.login-photo.config.ts --project=chromium --workers=1 --max-failures=1
          - suite: login-photo
            project: webkit
            browsers: webkit
            command: npx playwright test --config playwright.login-photo.config.ts --project=webkit --workers=1 --max-failures=1
          - suite: login-photo
            project: android
            browsers: chromium
            command: npx playwright test --config playwright.login-photo.config.ts --project=android --workers=1 --max-failures=1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-tests
        with:
          browsers: ${{ matrix.browsers }}
      - name: Mutation-blocked live ${{ matrix.suite }} checks
        env:
          CANARY_BASE_URL: https://agmetricapp.com
          EXPECTED_COMMIT: ${{ needs.deploy.outputs.build-commit }}
          APP_LIFECYCLE_BASE_URL: https://agmetricapp.com
          SESSION_RECOVERY_BASE_URL: https://agmetricapp.com
          LOGIN_PHOTO_BASE_URL: https://agmetricapp.com
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-${{ matrix.suite }}-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
            artifacts
          if-no-files-found: ignore
          retention-days: 7

  report-production-health:
    if: always() && github.ref == 'refs/heads/main'
    needs: [validation, deploy, exact-live, post-deployment-canary]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open, update, or close the sanitized hosted-health incident
        uses: actions/github-script@v7
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PUBLISHED: ${{ needs.deploy.outputs.published }}
          LIVE_RESULT: ${{ needs.exact-live.result }}
          CANARY_RESULT: ${{ needs.post-deployment-canary.result }}
        with:
          script: |
            if (process.env.VALIDATION_RESULT === 'success' &&
                process.env.DEPLOY_RESULT === 'success' && process.env.PUBLISHED !== 'true') {
              core.notice('Superseded candidate was not published; no production incident.');
              return;
            }
            const healthy = ['VALIDATION_RESULT','DEPLOY_RESULT','LIVE_RESULT','CANARY_RESULT']
              .every(key => process.env[key] === 'success');
            const code = process.env.VALIDATION_RESULT !== 'success' ? 'RELEASE_VALIDATION_FAILED'
              : process.env.DEPLOY_RESULT !== 'success' ? 'DEPLOY_TO_PAGES_FAILED'
              : process.env.LIVE_RESULT !== 'success' ? 'LIVE_RELEASE_MISMATCH'
              : 'POST_DEPLOYMENT_REQUEST_CANARY_FAILED';
            const title = '[Hosted Health] Production health check failing';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner,repo,state:'open',per_page:100});
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            const run = context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId;
            if (healthy) {
              if (existing) {
                await github.rest.issues.createComment({owner,repo,issue_number:existing.number,
                  body:'Recovered automatically. All parallel release checks passed for commit ' + context.sha + '. Run: ' + run});
                await github.rest.issues.update({owner,repo,issue_number:existing.number,state:'closed'});
              }
              return;
            }
            const body = ['The production release or its sanitized canaries failed.', '',
              'Error code: ' + code, 'Run: ' + run, 'Commit: ' + context.sha, '',
              'No business data, credentials, tokens, or user information are included.'].join('\n');
            if (existing) await github.rest.issues.createComment({owner,repo,issue_number:existing.number,body});
            else await github.rest.issues.create({owner,repo,title,body});
