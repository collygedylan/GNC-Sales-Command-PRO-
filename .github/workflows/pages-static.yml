name: Deploy static app to Pages

on:
  workflow_dispatch:
    inputs:
      expected-commit:
        description: Merged main SHA supplied by the trusted publisher; empty selects this run's main SHA.
        type: string
        required: false
        default: ''
      reuse-v230-passing-suites:
        description: Honor the explicit v2.3.0 authorization to retain already-passing Node and React evidence.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

# Keep branch publication and hosted verification together; backend runs independently.
concurrency:
  group: pages-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require the requested current main commit
        uses: actions/github-script@v7
        env:
          EXPECTED_COMMIT: ${{ inputs.expected-commit }}
        with:
          script: |
            const expected = process.env.EXPECTED_COMMIT || context.sha;
            if (!/^[a-f0-9]{40}$/.test(expected) || expected !== context.sha) {
              throw new Error('FRONTEND_EXPECTED_COMMIT_MISMATCH');
            }
            const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            if (main.object.sha !== context.sha) throw new Error('FRONTEND_MAIN_SUPERSEDED');

  validation:
    needs: authorize-main
    uses: ./.github/workflows/release-validation.yml
    with:
      fast-pr: true
      run-nightly-suites: false
      run-frontend-tests: true
      run-backend-tests: false
      run-schema-tests: false
      production-health: false
      reuse-v230-passing-suites: ${{ inputs.reuse-v230-passing-suites }}
    secrets: inherit

  deploy:
    needs: [authorize-main, validation]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.authorize-main.result == 'success' && needs.validation.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
      pages: write
    environment:
      name: github-pages
      url: https://agmetricapp.com/
    outputs:
      build-commit: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.validation.outputs.digest }}
          run-id: ${{ github.run_id }}
          artifact-id: ${{ needs.validation.outputs.site-id }}
          token: ${{ github.token }}
          commit: ${{ github.sha }}
      - name: Reject a stale main commit immediately before publication
        uses: actions/github-script@v7
        env:
          EXPECTED_COMMIT: ${{ inputs.expected-commit }}
          VALIDATED_RUN_ID: ${{ needs.validation.outputs.run-id }}
          VALIDATED_ATTEMPT: ${{ needs.validation.outputs.attempt }}
        with:
          script: |
            const expected = process.env.EXPECTED_COMMIT || context.sha;
            if (expected !== context.sha || process.env.VALIDATED_RUN_ID !== String(context.runId)
                || process.env.VALIDATED_ATTEMPT !== process.env.GITHUB_RUN_ATTEMPT) {
              throw new Error('FRONTEND_VALIDATION_IDENTITY_MISMATCH');
            }
            const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            if (main.object.sha !== context.sha) throw new Error('FRONTEND_MAIN_SUPERSEDED');
      - name: Wait for scoped backend migrations and Edge publication
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const receiptPath = pkg.scopedValidationReceipt;
            if (!receiptPath) {
              core.info('No source-sealed scoped release receipt; retaining independent Pages publication.');
              return;
            }
            const receipt = JSON.parse(fs.readFileSync(receiptPath, 'utf8'));
            const sourceHashes = receipt.sourceHashes;
            if (!sourceHashes || typeof sourceHashes !== 'object' || Array.isArray(sourceHashes) ||
                !Array.isArray(receipt.deployment?.migrations)) {
              throw new Error('SCOPED_BACKEND_MIGRATION_RECEIPT_INVALID');
            }
            const sourceMigrations = Object.keys(sourceHashes)
              .filter(file => /^supabase\/migrations\/[^/]+\.sql$/i.test(file)).sort();
            const receiptMigrations = [...receipt.deployment.migrations].sort();
            if (receiptMigrations.some(file => typeof file !== 'string' ||
                !/^supabase\/migrations\/[^/]+\.sql$/i.test(file)) ||
                JSON.stringify(sourceMigrations) !== JSON.stringify(receiptMigrations)) {
              throw new Error('SCOPED_BACKEND_MIGRATION_RECEIPT_MISMATCH');
            }
            if (receiptMigrations.length === 0) {
              core.info('Scoped release has no database migrations; Pages publication is independent.');
              return;
            }

            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const { data: workflow } = await github.rest.actions.getWorkflow({
              owner, repo, workflow_id: 'apps-script-sync.yml',
            });
            if (workflow.path !== '.github/workflows/apps-script-sync.yml' || workflow.state !== 'active') {
              throw new Error('SCOPED_BACKEND_WORKFLOW_INVALID');
            }
            const deadline = Date.now() + 10 * 60 * 1000;
            let deployRun;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: workflow.id, head_sha: context.sha,
                event: 'workflow_dispatch', per_page: 100,
              });
              const candidates = (data.workflow_runs || []).filter(run =>
                run.workflow_id === workflow.id && run.path === workflow.path &&
                run.head_branch === 'main' && run.head_sha === context.sha &&
                run.event === 'workflow_dispatch' && run.head_repository?.full_name === repository);
              deployRun = candidates.sort((a, b) => b.run_number - a.run_number)[0];
              if (deployRun?.status === 'completed') {
                if (deployRun.conclusion !== 'success') {
                  throw new Error(`SCOPED_BACKEND_PUBLICATION_FAILED:${deployRun.conclusion}`);
                }
                const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                  owner, repo, run_id: deployRun.id, per_page: 100,
                });
                const backendJobs = (jobs.jobs || []).filter(job =>
                  job.name === 'Apply backend migrations and deploy Edge Functions');
                if (backendJobs.length !== 1 || backendJobs[0].status !== 'completed' ||
                    backendJobs[0].conclusion !== 'success' || backendJobs[0].head_sha !== context.sha) {
                  throw new Error('SCOPED_BACKEND_DEPLOY_JOB_NOT_SUCCESSFUL');
                }
                break;
              }
              await new Promise(resolve => setTimeout(resolve, 15_000));
            }
            if (!deployRun || deployRun.status !== 'completed' || deployRun.conclusion !== 'success') {
              throw new Error('SCOPED_BACKEND_PUBLICATION_TIMEOUT');
            }
            const scriptFunctions = receipt.appsScriptChangedFunctions;
            if (!Array.isArray(scriptFunctions) || scriptFunctions.some(name => typeof name !== 'string' || !name)) {
              throw new Error('SCOPED_APPS_SCRIPT_RECEIPT_INVALID');
            }
            if (scriptFunctions.length > 0) {
              const { data: scriptWorkflow } = await github.rest.actions.getWorkflow({
                owner, repo, workflow_id: 'apps-script-deploy.yml',
              });
              if (scriptWorkflow.path !== '.github/workflows/apps-script-deploy.yml' || scriptWorkflow.state !== 'active') {
                throw new Error('SCOPED_APPS_SCRIPT_WORKFLOW_INVALID');
              }
              const scriptDeadline = Date.now() + 15 * 60 * 1000;
              let scriptRun;
              while (Date.now() < scriptDeadline) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id: scriptWorkflow.id, head_sha: context.sha,
                  event: 'workflow_run', per_page: 100,
                });
                const candidates = (data.workflow_runs || []).filter(run =>
                  run.workflow_id === scriptWorkflow.id && run.path === scriptWorkflow.path &&
                  run.head_branch === 'main' && run.head_sha === context.sha &&
                  run.event === 'workflow_run' && run.head_repository?.full_name === repository);
                scriptRun = candidates.sort((a, b) => b.run_number - a.run_number)[0];
                if (scriptRun?.status === 'completed') {
                  if (scriptRun.conclusion !== 'success') {
                    throw new Error(`SCOPED_APPS_SCRIPT_PUBLICATION_FAILED:${scriptRun.conclusion}`);
                  }
                  const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                    owner, repo, run_id: scriptRun.id, per_page: 100,
                  });
                  const publishJobs = (jobs.jobs || []).filter(job => job.name === 'deploy-apps-script');
                  const publishSteps = publishJobs.length === 1
                    ? (publishJobs[0].steps || []).filter(step => step.name === 'Publish the guarded production Apps Script version')
                    : [];
                  if (publishJobs.length !== 1 || publishJobs[0].status !== 'completed' ||
                      publishJobs[0].conclusion !== 'success' || publishJobs[0].head_sha !== context.sha ||
                      publishSteps.length !== 1 || publishSteps[0].status !== 'completed' ||
                      publishSteps[0].conclusion !== 'success') {
                    throw new Error('SCOPED_APPS_SCRIPT_PUBLISH_STEP_NOT_SUCCESSFUL');
                  }
                  break;
                }
                await new Promise(resolve => setTimeout(resolve, 15_000));
              }
              if (!scriptRun || scriptRun.status !== 'completed' || scriptRun.conclusion !== 'success') {
                throw new Error('SCOPED_APPS_SCRIPT_PUBLICATION_TIMEOUT');
              }
              core.info(`Exact guarded Apps Script publication succeeded for ${context.sha} (run ${scriptRun.id}).`);
            }
            const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            if (main.object.sha !== context.sha) throw new Error('FRONTEND_MAIN_SUPERSEDED_DURING_BACKEND_WAIT');
            core.info(`Exact scoped backend publication succeeded for ${context.sha} (run ${deployRun.id}).`);
      - name: Write the verified publication descriptor
        env:
          RELEASE_BUILD_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p artifacts/pages-publication
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('artifacts/pages-publication/publication.json', JSON.stringify({
            schemaVersion: 'gnc-pages-publication-v1',
            repository: process.env.GITHUB_REPOSITORY,
            commit: process.env.GITHUB_SHA,
            buildCommit: process.env.RELEASE_BUILD_COMMIT,
            runId: Number(process.env.GITHUB_RUN_ID),
            attempt: Number(process.env.GITHUB_RUN_ATTEMPT)
          }));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pages-publication-${{ github.run_attempt }}
          path: artifacts/pages-publication/publication.json
          if-no-files-found: error
          retention-days: 7
      - name: Deploy verified artifact to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repository="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch "$repository" gh-pages:refs/remotes/origin/gh-pages
          pages_dir="$RUNNER_TEMP/gnc-gh-pages"
          git worktree add --detach "$pages_dir" refs/remotes/origin/gh-pages
          rsync -a --delete --exclude='.git' _site/ "$pages_dir/"
          test -f "$pages_dir/CNAME"
          test -f "$pages_dir/.nojekyll"
          git -C "$pages_dir" add -A
          if git -C "$pages_dir" diff --cached --quiet; then
            echo 'GHPAGES_ALREADY_CURRENT'
            exit 0
          fi
          git -C "$pages_dir" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish ${GITHUB_SHA:0:12} to GitHub Pages"
          git -C "$pages_dir" push "$repository" HEAD:gh-pages
      # GITHUB_TOKEN branch pushes do not automatically start a Pages build.
      - name: Request the GitHub Pages build for the published branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'

  exact-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the current live descriptor and immutable fingerprint
        env:
          CANARY_BASE_URL: https://agmetricapp.com
          EXPECTED_COMMIT: ${{ needs.deploy.outputs.build-commit }}
          REQUIRE_CURRENT_LIVE_DESCRIPTOR: '1'
          CANARY_WAIT_TIMEOUT_MS: '600000'
          CANARY_WAIT_INTERVAL_MS: '5000'
        run: node scripts/wait-for-live-release.mjs
      - name: Report the verified live version
        run: |
          version=$(node --input-type=module -e "import { readExpectedRelease } from './scripts/deployment-fingerprint-lib.mjs'; console.log(await readExpectedRelease());")
          echo "${version} is now LIVE"
          echo "${version} is now LIVE" >> "$GITHUB_STEP_SUMMARY"
