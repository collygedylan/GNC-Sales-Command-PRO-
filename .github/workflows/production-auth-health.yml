name: Production login health

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy static app to Pages']
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: production-login-health
  cancel-in-progress: false

jobs:
  published-release:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should-probe: ${{ steps.published.outputs.should-probe }}
      expected-commit: ${{ steps.descriptor.outputs.expected-commit || steps.published.outputs.expected-commit }}
      descriptor-id: ${{ steps.published.outputs.descriptor-id }}
    steps:
      - name: Distinguish an actual publication from a failed or superseded candidate
        id: published
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'workflow_run') {
              core.setOutput('should-probe', 'true');
              core.setOutput('expected-commit', context.sha);
              return;
            }
            const event = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: event.id,
            });
            const trusted = run.path === '.github/workflows/pages-static.yml' &&
              ['push', 'workflow_dispatch'].includes(run.event) &&
              run.status === 'completed' &&
              run.run_attempt === event.run_attempt && run.head_sha === event.head_sha &&
              run.head_branch === 'main' &&
              run.head_repository?.full_name?.toLowerCase() === `${owner}/${repo}`.toLowerCase();
            if (!trusted) {
              core.setOutput('should-probe', 'false');
              core.notice('Ignoring an untrusted, mismatched, or incomplete workflow_run event.');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...context.repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100
            });
            const deployJobs = jobs.filter(job => job.name === 'deploy' && job.run_id === run.id &&
              job.head_sha === run.head_sha && job.status === 'completed' && job.conclusion === 'success' &&
              job.steps?.some(step => ['Deploy verified artifact to Pages', 'Deploy to Pages'].includes(step.name) &&
                step.status === 'completed' && step.conclusion === 'success'));
            const published = deployJobs.length === 1;
            core.setOutput('should-probe', String(published));
            core.setOutput('expected-commit', run.head_sha);
            if (!published) core.notice('No unique successful deployment for this Pages run attempt; normal scheduled production checks remain active.');
            if (!published) return;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: run.id, per_page: 100
            });
            const descriptors = artifacts.filter(item => item.name === `pages-publication-${run.run_attempt}`);
            if (!descriptors.length) return; // Compatibility for Pages runs predating descriptors.
            if (descriptors.length !== 1) throw new Error('PAGES_PUBLICATION_DESCRIPTOR_AMBIGUOUS');
            const descriptor = descriptors[0];
            if (!Number.isSafeInteger(descriptor.id) || descriptor.id < 1 || descriptor.expired !== false ||
                !(Date.parse(descriptor.expires_at) > Date.now()) ||
                descriptor.workflow_run?.id !== run.id || descriptor.workflow_run?.head_sha !== run.head_sha) {
              throw new Error('PAGES_PUBLICATION_DESCRIPTOR_ARTIFACT_INVALID');
            }
            core.setOutput('descriptor-id', String(descriptor.id));
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run' && steps.published.outputs.should-probe == 'true' && steps.published.outputs.descriptor-id != ''
        with:
          artifact-ids: ${{ steps.published.outputs.descriptor-id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts/pages-publication
          merge-multiple: true
      - name: Validate publication descriptor or keep legacy commit fallback
        id: descriptor
        if: github.event_name == 'workflow_run' && steps.published.outputs.should-probe == 'true'
        env:
          DESCRIPTOR_ID: ${{ steps.published.outputs.descriptor-id }}
          PAGES_RUN_ID: ${{ github.event.workflow_run.id }}
          PAGES_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          PAGES_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const output = process.env.GITHUB_OUTPUT;
          if (!process.env.DESCRIPTOR_ID) {
            fs.appendFileSync(output, `expected-commit=${process.env.PAGES_RUN_SHA}\n`);
            console.log('No publication descriptor found; using the Pages run commit for rollout compatibility.');
            process.exit(0);
          }
          const value = JSON.parse(fs.readFileSync('artifacts/pages-publication/publication.json', 'utf8'));
          if (value.schemaVersion !== 'gnc-pages-publication-v1' ||
              value.repository !== process.env.GITHUB_REPOSITORY ||
              value.commit !== process.env.PAGES_RUN_SHA ||
              value.runId !== Number(process.env.PAGES_RUN_ID) ||
              value.attempt !== Number(process.env.PAGES_RUN_ATTEMPT) ||
              !/^[a-f0-9]{40}$/i.test(value.buildCommit || '')) {
            throw new Error('PAGES_PUBLICATION_DESCRIPTOR_INVALID');
          }
          fs.appendFileSync(output, `expected-commit=${value.buildCommit}\n`);
          NODE
  probe:
    needs: published-release
    if: needs.published-release.outputs.should-probe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Exact commit parity belongs to the completed Pages workflow. A
      # five-minute scheduled run can otherwise see main while that workflow is
      # still building its full browser test suite, which is not an outage.
      - name: Verify the completed Pages deployment is the exact live release
        if: github.event_name == 'workflow_run'
        id: live_release
        continue-on-error: true
        env:
          CANARY_BASE_URL: https://agmetricapp.com
          EXPECTED_COMMIT: ${{ needs.published-release.outputs.expected-commit }}
          CANARY_WAIT_TIMEOUT_MS: '180000'
          CANARY_WAIT_INTERVAL_MS: '5000'
        run: node scripts/wait-for-live-release.mjs
      - name: Probe and self-heal production app services
        id: production_probe
        continue-on-error: true
        env:
          PRODUCTION_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUEST_DELIVERY_CRON_SECRET: ${{ secrets.REQUEST_DELIVERY_CRON_SECRET }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          REQUIRE_APPS_SCRIPT_HEALTH: '1'
          REQUIRE_LIVE_RELEASE_MATCH: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
        run: node scripts/probe-production-auth-health.mjs
      - name: Open or update the production health incident
        if: (github.event_name == 'workflow_run' && steps.live_release.outcome == 'failure') || steps.production_probe.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Hosted Health] Production health check failing';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            const code = '${{ steps.live_release.outcome }}' === 'failure'
              ? 'LIVE_RELEASE_MISMATCH'
              : 'PRODUCTION_SERVICE_PROBE_FAILED';
            const body = [
              'The five-minute hosted production check failed after its safe self-healing pass.',
              '',
              `Error code: ${code}`,
              `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              `Commit: ${context.sha}`,
              '',
              'The run contains sanitized error codes only. Customer data, notes, photos, names, and URLs are excluded.'
            ].join('\n');
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
      - name: Close a recovered production health incident
        if: (github.event_name != 'workflow_run' || steps.live_release.outcome == 'success') && steps.production_probe.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Hosted Health] Production health check failing';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            for (const issue of issues.filter((item) => !item.pull_request && item.title === title)) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Recovered automatically. Healthy run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
              });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }
      - name: Fail when production remains unhealthy
        if: (github.event_name == 'workflow_run' && steps.live_release.outcome == 'failure') || steps.production_probe.outcome == 'failure'
        run: exit 1
