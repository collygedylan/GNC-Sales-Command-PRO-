name: Diagnose low-stock database connection

on:
  workflow_dispatch:
    inputs:
      target:
        description: Select a read-only database or Apps Script health probe.
        type: choice
        options:
          - database
          - apps-script
          - manual-drive
        default: database
        required: true

permissions:
  contents: read

jobs:
  diagnose-database:
    name: Read-only database connection diagnosis
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install locked dependencies without lifecycle scripts
        uses: ./.github/actions/setup-node-dependencies
        with:
          node-version: 20
          install-mode: ignore-scripts
      - name: Probe the configured database without applying migrations
        if: inputs.target == 'database'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/apply-item-low-stock-migration.mjs --diagnose
      - name: Probe Apps Script signed deployment health
        if: inputs.target == 'apps-script'
        env:
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { createSignedDeploymentHealthEnvelope } from './scripts/apps-script-signing.mjs';
          const safeCodes = new Set([
            'APPS_SCRIPT_ACTION_SIGNATURE_REQUIRED', 'APPS_SCRIPT_ACTION_SIGNATURE_EXPIRED',
            'APPS_SCRIPT_ACTION_SIGNING_KEY_MISSING', 'APPS_SCRIPT_ACTION_SIGNATURE_INVALID',
            'APPS_SCRIPT_ACTION_PAYLOAD_INVALID', 'APPS_SCRIPT_HEALTH_ACTOR_INVALID',
            'APPS_SCRIPT_POST_SIGNATURE_REQUIRED'
          ]);
          const deploymentId = String(process.env.APPS_SCRIPT_DEPLOYMENT_ID || '').trim();
          const key = String(process.env.SUPABASE_SERVICE_ROLE_KEY || '').trim();
          if (!deploymentId || !key) throw new Error('APPS_SCRIPT_HEALTH_CONFIGURATION_MISSING');
          const response = await fetch(`https://script.google.com/macros/s/${encodeURIComponent(deploymentId)}/exec`, {
            method: 'POST', redirect: 'follow', headers: { 'content-type': 'application/json' },
            body: JSON.stringify(createSignedDeploymentHealthEnvelope(key)), signal: AbortSignal.timeout(20000)
          });
          let payload = null;
          try { payload = await response.json(); } catch {}
          const errorCode = safeCodes.has(String(payload?.message || payload?.errorCode || ''))
            ? String(payload.message || payload.errorCode) : '';
          const deployedCommit = /^[a-f0-9]{40}$/i.test(String(payload?.deployedCommit || ''))
            ? String(payload.deployedCommit) : '';
          console.log(JSON.stringify({ status: response.status, ok: response.ok && payload?.ok === true,
            errorCode, deployedCommit }));
          if (!response.ok || payload?.ok !== true) process.exitCode = 1;
          NODE
      - name: Run guarded Drive import recovery
        if: inputs.target == 'manual-drive'
        env:
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          APPS_SCRIPT_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_SCRIPT_ID }}
          APPS_SCRIPT_CLASPRC_JSON: ${{ secrets.APPS_SCRIPT_CLASPRC_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { google } from 'googleapis';
          import { createSignedAppsScriptActionEnvelope } from './scripts/apps-script-signing.mjs';
          const deploymentId = String(process.env.APPS_SCRIPT_DEPLOYMENT_ID || '').trim();
          const supabaseUrl = String(process.env.SUPABASE_URL || '').replace(/\/$/, '');
          const key = String(process.env.SUPABASE_SERVICE_ROLE_KEY || '').trim();
          if (!deploymentId || !supabaseUrl || !key) throw new Error('MANUAL_DRIVE_CONFIGURATION_MISSING');
          const headers = { apikey: key, authorization: `Bearer ${key}`, 'content-type': 'application/json' };
          const profilesResponse = await fetch(`${supabaseUrl}/rest/v1/profiles?select=id,username&username=eq.dylan_collyge&limit=2`, { headers });
          const profiles = profilesResponse.ok ? await profilesResponse.json() : [];
          if (profiles.length !== 1) throw new Error('MANUAL_DRIVE_ACTOR_MISSING');
          const accessResponse = await fetch(`${supabaseUrl}/rest/v1/rpc/user_access_command_v1`, {
            method: 'POST', headers, body: JSON.stringify({ p_actor_profile_id: profiles[0].id, p_operation: 'resolve', p_payload: {} })
          });
          const access = accessResponse.ok ? await accessResponse.json() : null;
          const resolved = access?.data || access;
          const role = String(resolved?.baseline?.role || '').trim().toLowerCase();
          if (!role) throw new Error('MANUAL_DRIVE_ACTOR_ROLE_MISSING');
          const envelope = createSignedAppsScriptActionEnvelope({
            contractVersion: 'apps-script-action-v1', action: 'manual_run',
            payload: { type: 'manual_run', job: 'drive', trigger: 'release_recovery', run_inline: true,
              fast: true, force: true, force_if_stale: true },
            actor: { id: profiles[0].id, username: profiles[0].username, role }
          }, key);
          const started = Date.now();
          const response = await fetch(`https://script.google.com/macros/s/${encodeURIComponent(deploymentId)}/exec`, {
            method: 'POST', redirect: 'follow', headers: { 'content-type': 'application/json' },
            body: JSON.stringify(envelope), signal: AbortSignal.timeout(330000)
          });
          let payload = null;
          try { payload = await response.json(); } catch {}
          const result = { status: response.status, ok: response.ok && payload?.active === false && !payload?.errorCode,
            elapsedMs: Date.now() - started, runId: String(payload?.runId || ''), stage: String(payload?.currentStage || ''),
            errorCode: String(payload?.errorCode || '') };
          if (!result.ok) {
            const clasp = JSON.parse(String(process.env.APPS_SCRIPT_CLASPRC_JSON || '{}'));
            const tokens = clasp.tokens && typeof clasp.tokens === 'object' ? clasp.tokens : {};
            const token = clasp.token || (tokens.refresh_token ? tokens : Object.values(tokens).find(value => value?.refresh_token)) || {};
            const settings = clasp.oauth2ClientSettings || clasp.oauth2Client || {};
            const auth = new google.auth.OAuth2(settings.clientId || settings.client_id || token.client_id,
              settings.clientSecret || settings.client_secret || token.client_secret,
              settings.redirectUri || settings.redirect_uri || token.redirect_uri || 'http://localhost');
            auth.setCredentials({ refresh_token: token.refresh_token, access_token: token.access_token,
              token_type: token.token_type || 'Bearer', expiry_date: token.expiry_date });
            try {
              const execution = await google.script({ version: 'v1', auth }).scripts.run({
                scriptId: String(process.env.APPS_SCRIPT_SCRIPT_ID || '').trim(),
                requestBody: { function: 'runDriveAroundOnly', devMode: false }
              });
              const direct = execution.data?.response?.result || null;
              result.direct = { done: execution.data?.done === true, filesProcessed: Number(direct?.filesProcessed || 0),
                failedFiles: Number(direct?.failedFiles || 0), errorCode: String(direct?.errorCode || '') };
              result.ok = result.direct.done && result.direct.filesProcessed > 0 && result.direct.failedFiles === 0;
            } catch (error) {
              const message = String(error?.response?.data?.error?.details?.[0]?.errorMessage || error?.message || '');
              const sqlstate = /"code"\s*:\s*"([A-Z0-9]{5})"/i.exec(message)?.[1]?.toUpperCase() || '';
              const safeCode = sqlstate ? `IMPORT_DATABASE_${sqlstate}`
                : (/\b(MASTER_BULK_[A-Z0-9_]+)\b/.exec(message)?.[1] || 'APPS_SCRIPT_EXECUTION_FAILED');
              result.direct = { done: false, filesProcessed: 0, failedFiles: 1, errorCode: safeCode };
            }
          }
          console.log(JSON.stringify(result));
          if (!result.ok) process.exitCode = 1;
          NODE
