name: PWA and Supabase performance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-and-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Prepare isolated migration project
        shell: bash
        run: |
          set -euo pipefail
          ci_root="$RUNNER_TEMP/gnc-supabase-ci"
          mkdir -p "$ci_root/supabase/migrations" "$ci_root/supabase/tests"
          cp supabase/config.toml "$ci_root/supabase/config.toml"
          cp -R supabase/functions "$ci_root/supabase/functions"
          : > "$ci_root/supabase/seed.sql"
          cp supabase/ci/request_workflow_baseline.sql "$ci_root/supabase/migrations/20260803100000_request_workflow_baseline.sql"
          cp supabase/ci/historical_report_baseline.sql "$ci_root/supabase/migrations/20260803105000_historical_report_baseline.sql"
          cp supabase/migrations/20260803121000_add_request_note_to_ph_active_request.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260803225959_add_csr_request_audit_fields.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260816172822_native_auth_profiles.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260816172823_pwa_containment_flags.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260816172825_database_compaction_shadow.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260817154154_restore_native_request_workflow.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260820114722_request_integrity_and_eval_assignments.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260820133000_request_integrity_health_profile_index.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260820134500_profiles_service_role_grant.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260820140000_master_inventory_service_role_grant.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260820143000_suppress_initial_eval_event_fanout.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260820150000_legacy_completion_atomic_guard.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260820160000_eval_assignment_roster_and_sheet_cutover.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260820190857_acknowledge_stale_completed_request_work.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260820195456_complete_eval_assignment_sheet_import.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260820202902_reconcile_exact_assignment_sheet.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260820230245_reliable_request_delivery_worker.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260821011223_hosted_health_auto_repair.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260821012500_restore_request_email_threads_schema.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260821040617_manager_eval_report_settings.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260821040854_harden_eval_report_settings_rpc.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260821202202_manager_historical_report.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260821223421_historical_report_default_browse.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260823013134_expand_historical_report_source_columns.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260825222325_stabilize_request_capabilities.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260825223040_grant_request_policy_helper.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260826133016_allow_chance_alldredge_request_create_own.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260826170020_request_capabilities_v2_restore_kayla.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260828024750_centralized_access_control_audit_v1.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260828070741_access_control_manager_read_v2.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260830021512_mobile_codex_operations_v1.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260830022003_codex_ops_terra_escalation_v2.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260830023800_codex_ops_access_audit_baseline_v1.sql "$ci_root/supabase/migrations/"
          cp supabase/tests/native_auth_rls_test.sql "$ci_root/supabase/tests/"
          cp supabase/tests/request_integrity_rls_test.sql "$ci_root/supabase/tests/"
          cp supabase/tests/codex_ops_rls_test.sql "$ci_root/supabase/tests/"
          echo "SUPABASE_CI_ROOT=$ci_root" >> "$GITHUB_ENV"
      - name: Start isolated Supabase stack
        run: supabase --workdir "$SUPABASE_CI_ROOT" start
      - name: Apply migrations to isolated database
        run: supabase --workdir "$SUPABASE_CI_ROOT" db reset --local --no-seed
      - name: Run pgTAP and RLS tests
        run: supabase --workdir "$SUPABASE_CI_ROOT" test db
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser request transactions against local Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase --workdir "$SUPABASE_CI_ROOT" status -o env > "$RUNNER_TEMP/supabase-status.env"
          set -a
          source "$RUNNER_TEMP/supabase-status.env"
          set +a
          SUPABASE_LOCAL_URL="$API_URL" \
          SUPABASE_LOCAL_ANON_KEY="$ANON_KEY" \
          SUPABASE_LOCAL_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          npx playwright test tests/request-integrity-local.spec.js --project=chromium
      - name: Run Edge Function unit tests
        run: deno test --allow-env --allow-net supabase/functions
      - name: Save relation-size report query
        run: |
          mkdir -p artifacts
          cp scripts/report-database-bloat.sql artifacts/report-database-bloat.sql
          cp scripts/report-unused-table-candidates.sql artifacts/report-unused-table-candidates.sql
          cp scripts/report-rls-policies.sql artifacts/report-rls-policies.sql
          cp scripts/report-secret-bearing-functions.sql artifacts/report-secret-bearing-functions.sql
          cp scripts/report-drive-around-compaction-parity.sql artifacts/report-drive-around-compaction-parity.sql
          cp scripts/report-app-live-events-retirement.sql artifacts/report-app-live-events-retirement.sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-performance-report-query
          path: artifacts

  pwa-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe production login bridge and Data API
        env:
          PRODUCTION_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUEST_DELIVERY_CRON_SECRET: ${{ secrets.REQUEST_DELIVERY_CRON_SECRET }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          REQUIRE_APPS_SCRIPT_HEALTH: '1'
        run: node scripts/probe-production-auth-health.mjs
      - run: npm run check:inline
      - run: npm run test:pilot
      - run: npm run test:v2
      - run: npm run build:v2
      - run: npm run build:live
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:v2:e2e
      - name: Prepare static shell for Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html manifest.json sw.js OneSignalSDKWorker.js _site/
          cp -r assets _site/assets
          cp ./*.png _site/
      - name: Run Lighthouse CI with bounded protocol retry
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            log_file="$(mktemp)"
            if npx lhci autorun --config=lighthouserc.json 2>&1 | tee "$log_file"; then
              rm -f "$log_file"
              exit 0
            fi

            if ! grep -Eq 'PROTOCOL_TIMEOUT|Waiting for DevTools protocol response has exceeded the allotted time' "$log_file"; then
              rm -f "$log_file"
              exit 1
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Lighthouse exhausted three attempts after DevTools protocol timeouts."
              rm -f "$log_file"
              exit 1
            fi

            echo "Lighthouse DevTools protocol timeout on attempt ${attempt}; retrying."
            rm -f "$log_file"
            rm -rf .lighthouseci
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-and-browser-results
          path: |
            .lighthouseci
            playwright-report
            test-results
          if-no-files-found: ignore
