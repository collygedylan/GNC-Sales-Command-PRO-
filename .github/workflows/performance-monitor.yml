name: PWA and Supabase performance

on:
  pull_request:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# A main push is validated once by Pages. PR, scheduled and manual checks reuse
# the identical lanes without publishing or duplicating main-push verification.
jobs:
  validation:
    uses: ./.github/workflows/release-validation.yml
    with:
      production-health: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    secrets: inherit
