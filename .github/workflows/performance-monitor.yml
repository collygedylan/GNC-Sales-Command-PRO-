name: PWA and Supabase performance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# PRs run selected unit/lint checks without builds or publication proofs.
# Browser and performance checks belong to Nightly browser validation.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      hotfix: ${{ steps.hotfix.outputs.hotfix }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' }}
      backend: ${{ steps.filter.outputs.backend == 'true' }}
      schema: ${{ steps.filter.outputs.schema == 'true' }}
    steps:
      - name: Detect exact hotfix marker
        id: hotfix
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            let hotfix = String(pr?.title || '').includes('[hotfix]');
            if (!hotfix) {
              const { data: commit } = await github.rest.repos.getCommit({
                ...context.repo, ref: pr?.head?.sha || context.sha,
              });
              hotfix = String(commit.commit?.message || '').includes('[hotfix]');
            }
            core.setOutput('hotfix', String(hotfix));
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            frontend:
              - '{index.html,Code.gs,manifest.json,OneSignalSDKWorker.js,CNAME,assets/**,components/**,styles/**,src/**,v2/**,pages/**,services/**,utils/**,live-src/**,scripts/**,tests/**,.github/**,performance/**,Dockerfile*,package.json,package-lock.json,playwright*.config.*,vite*.config.*,tsconfig*.json,lighthouserc.json}'
            backend:
              - '{supabase/**,database/**,migrations/**,**/*_migration.sql,services/reclassMove.ts,deno.lock,deno.json,deno.jsonc,.github/**,package.json,package-lock.json,scripts/**,tests/**}'
            schema:
              - '{supabase/**,database/**}'

  validation:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.result == 'success' }}
    uses: ./.github/workflows/pr-validation.yml
    with:
      run-frontend-tests: ${{ needs.changes.outputs.frontend == 'true' }}
      run-backend-tests: ${{ needs.changes.outputs.backend == 'true' }}

  diagnostic-validation:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.changes.result == 'success' }}
    uses: ./.github/workflows/release-validation.yml
    with:
      hotfix: ${{ needs.changes.outputs.hotfix == 'true' }}
      run-nightly-suites: false
      run-schema-tests: false
      production-health: false
      run-frontend-tests: true
      run-backend-tests: false
    secrets: inherit
