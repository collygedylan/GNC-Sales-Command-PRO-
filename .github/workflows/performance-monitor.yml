name: PWA and Supabase performance

on:
  workflow_dispatch:

permissions:
  contents: read

# One-use isolated SQL validation branch. This workflow is not part of the release PR.
# Node, React, and prior simulator results remain retained per explicit user instruction.
jobs:
  isolated-sql-validation:
    uses: ./.github/workflows/release-database.yml
    with:
      run-schema-tests: true
      run-all-schema-tests: true
      run-browser-tests: false
      run-performance-tests: false
