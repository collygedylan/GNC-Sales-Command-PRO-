          cp supabase/migrations/20260902140500_repair_manager_order_finalizer_privilege.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260902141956_repair_pikes_assignment_health_rpc_privilege.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260902151444_optimize_bounded_request_maintenance.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260902152210_bound_eval_assignment_delta.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260902152707_separate_request_health_audit.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260902160400_optimize_po_management_health_snapshot.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260902165500_current_request_membership_health.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260901192727_repair_request_option_append.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260901201209_eval_report2_completion_routing.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260903013541_repair_reclass_task_flyer_access_v1.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260903032040_protected_drive_reclass_inquiry_v1.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260903035800_drive_reclass_access_audit_baseline_v1.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260903171416_repair_season_sales_office_custom_av_staging.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260903180500_repair_season_sales_pgcrypto_search_path.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260903181500_repair_season_sales_winner_alias.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260903183000_reconcile_legacy_season_sales_mirrors.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260903190000_baseline_eval_itemcode_delivery_health_v2.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260904015607_emergency_drive_evidence_retry_storm_v2.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260904070154_photo_delivery_health_v1.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260904142737_dylan_photo_history_gallery_v1.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260904143546_photo_history_catalog_refresh_refinement.sql "$ci_root/supabase/migrations/"
          cp supabase/ci/photo_history_extensions.sql "$ci_root/supabase/migrations/20260904142700_photo_history_extensions.sql"
          cp supabase/tests/native_auth_rls_test.sql "$ci_root/supabase/tests/"
          cp supabase/tests/request_integrity_rls_test.sql "$ci_root/supabase/tests/"
          cp supabase/tests/codex_ops_rls_test.sql "$ci_root/supabase/tests/"
          cp supabase/tests/pikes_orders_rls_test.sql "$ci_root/supabase/tests/"
          cp supabase/tests/request_eval_drive_reliability_test.sql "$ci_root/supabase/tests/"
          cp supabase/tests/request_option_append_test.sql "$ci_root/supabase/tests/"
          cp supabase/tests/drive_reclass_protected_test.sql "$ci_root/supabase/tests/"
          cp supabase/tests/drive_evidence_retry_storm_test.sql "$ci_root/supabase/tests/"
          cp supabase/tests/photo_delivery_health_rls_test.sql "$ci_root/supabase/tests/"
          cp supabase/tests/photo_history_rls_test.sql "$ci_root/supabase/tests/"
          echo "SUPABASE_CI_ROOT=$ci_root" >> "$GITHUB_ENV"
      - name: Start isolated Supabase stack
        run: supabase --workdir "$SUPABASE_CI_ROOT" start
      - name: Apply migrations to isolated database
        run: supabase --workdir "$SUPABASE_CI_ROOT" db reset --local --no-seed
      - name: Run pgTAP and RLS tests
        run: supabase --workdir "$SUPABASE_CI_ROOT" test db
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser request transactions against local Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase --workdir "$SUPABASE_CI_ROOT" status -o env > "$RUNNER_TEMP/supabase-status.env"
          set -a
          source "$RUNNER_TEMP/supabase-status.env"
          set +a
          SUPABASE_LOCAL_URL="$API_URL" \
          SUPABASE_LOCAL_ANON_KEY="$ANON_KEY" \
          SUPABASE_LOCAL_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          npx playwright test tests/request-integrity-local.spec.js tests/native-auth-provisioning-local.spec.js --project=chromium
      - name: Run Edge Function unit tests
        run: deno test --allow-env --allow-net supabase/functions
      - name: Save relation-size report query
        run: |
          mkdir -p artifacts
          cp scripts/report-database-bloat.sql artifacts/report-database-bloat.sql
          cp scripts/report-unused-table-candidates.sql artifacts/report-unused-table-candidates.sql
          cp scripts/report-rls-policies.sql artifacts/report-rls-policies.sql
          cp scripts/report-secret-bearing-functions.sql artifacts/report-secret-bearing-functions.sql
          cp scripts/report-drive-around-compaction-parity.sql artifacts/report-drive-around-compaction-parity.sql
          cp scripts/report-app-live-events-retirement.sql artifacts/report-app-live-events-retirement.sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-performance-report-query
          path: artifacts

  pwa-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe production login bridge and Data API
        env:
          PRODUCTION_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUEST_DELIVERY_CRON_SECRET: ${{ secrets.REQUEST_DELIVERY_CRON_SECRET }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          REQUIRE_APPS_SCRIPT_HEALTH: '1'
          REQUIRE_BOUNDED_MAINTENANCE: '1'
        run: node scripts/probe-production-auth-health.mjs
      - run: npm run check:inline
      - run: npm run test:photo
      - run: npm run test:pilot
      - run: npm run test:v2
      - run: npm run build:v2
      - run: npm run build:live
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:v2:e2e
      - name: Prepare static shell for Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html manifest.json sw.js OneSignalSDKWorker.js _site/
          cp -r assets _site/assets
          cp ./*.png _site/
      - name: Run Lighthouse CI with bounded protocol retry
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            log_file="$(mktemp)"
            if npx lhci autorun --config=lighthouserc.json 2>&1 | tee "$log_file"; then
              rm -f "$log_file"
              exit 0
            fi

            if ! grep -Eq 'PROTOCOL_TIMEOUT|Waiting for DevTools protocol response has exceeded the allotted time' "$log_file"; then
              rm -f "$log_file"
              exit 1
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Lighthouse exhausted three attempts after DevTools protocol timeouts."
              rm -f "$log_file"
              exit 1
            fi

            echo "Lighthouse DevTools protocol timeout on attempt ${attempt}; retrying."
            rm -f "$log_file"
            rm -rf .lighthouseci
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-and-browser-results
          path: |
            .lighthouseci
            playwright-report
            test-results
          if-no-files-found: ignore
