name: PWA and Supabase performance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-and-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Prepare isolated migration project
        shell: bash
        run: |
          set -euo pipefail
          ci_root="$RUNNER_TEMP/gnc-supabase-ci"
          mkdir -p "$ci_root/supabase/migrations" "$ci_root/supabase/tests"
          cp supabase/config.toml "$ci_root/supabase/config.toml"
          cp -R supabase/functions "$ci_root/supabase/functions"
          : > "$ci_root/supabase/seed.sql"
          cp supabase/ci/request_workflow_baseline.sql "$ci_root/supabase/migrations/20260803100000_request_workflow_baseline.sql"
          cp supabase/migrations/20260803121000_add_request_note_to_ph_active_request.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260803225959_add_csr_request_audit_fields.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260816172822_native_auth_profiles.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260816172823_pwa_containment_flags.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260816172825_database_compaction_shadow.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260817154154_restore_native_request_workflow.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260820114722_request_integrity_and_eval_assignments.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260820133000_request_integrity_health_profile_index.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260820134500_profiles_service_role_grant.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260820140000_master_inventory_service_role_grant.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260820143000_suppress_initial_eval_event_fanout.sql "$ci_root/supabase/migrations/"
          cp supabase/tests/native_auth_rls_test.sql "$ci_root/supabase/tests/"
          cp supabase/tests/request_integrity_rls_test.sql "$ci_root/supabase/tests/"
          echo "SUPABASE_CI_ROOT=$ci_root" >> "$GITHUB_ENV"
      - name: Start isolated Supabase stack
        run: supabase --workdir "$SUPABASE_CI_ROOT" start
      - name: Apply migrations to isolated database
        run: supabase --workdir "$SUPABASE_CI_ROOT" db reset --local --no-seed
      - name: Run pgTAP and RLS tests
        run: supabase --workdir "$SUPABASE_CI_ROOT" test db
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser request transactions against local Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase --workdir "$SUPABASE_CI_ROOT" status -o env > "$RUNNER_TEMP/supabase-status.env"
          set -a
          source "$RUNNER_TEMP/supabase-status.env"
          set +a
          SUPABASE_LOCAL_URL="$API_URL" \
          SUPABASE_LOCAL_ANON_KEY="$ANON_KEY" \
          SUPABASE_LOCAL_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          npx playwright test tests/request-integrity-local.spec.js --project=chromium
      - name: Run Edge Function unit tests
        run: deno test --allow-env --allow-net supabase/functions
      - name: Save relation-size report query
        run: |
          mkdir -p artifacts
          cp scripts/report-database-bloat.sql artifacts/report-database-bloat.sql
          cp scripts/report-unused-table-candidates.sql artifacts/report-unused-table-candidates.sql
          cp scripts/report-rls-policies.sql artifacts/report-rls-policies.sql
          cp scripts/report-secret-bearing-functions.sql artifacts/report-secret-bearing-functions.sql
          cp scripts/report-drive-around-compaction-parity.sql artifacts/report-drive-around-compaction-parity.sql
          cp scripts/report-app-live-events-retirement.sql artifacts/report-app-live-events-retirement.sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-performance-report-query
          path: artifacts

  pwa-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:inline
      - run: npm run test:pilot
      - run: npm run test:v2
      - run: npm run build:v2
      - run: npm run build:live
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:v2:e2e
      - name: Prepare static shell for Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html manifest.json sw.js OneSignalSDKWorker.js _site/
          cp -r assets _site/assets
          cp ./*.png _site/
      - run: npx lhci autorun --config=lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-and-browser-results
          path: |
            .lighthouseci
            playwright-report
            test-results
          if-no-files-found: ignore
