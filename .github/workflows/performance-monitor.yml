name: PWA and Supabase performance

on:
  pull_request:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Manual candidate checks run every required lane once against one sealed build.
# Main Pages verifies this run's proof and deploys its artifact without rebuilding.
jobs:
  validation:
    uses: ./.github/workflows/release-validation.yml
    with:
      production-health: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    secrets: inherit
