          cp supabase/ci/request_eval_drive_reliability_baseline.sql "$ci_root/supabase/migrations/20260827000000_request_eval_drive_reliability_baseline.sql"
          cp supabase/ci/sales_office_baseline.sql "$ci_root/supabase/migrations/20260827000001_sales_office_baseline.sql"
          cp supabase/ci/flyer_folder_batch_contract_baseline.sql "$ci_root/supabase/migrations/20260903013000_flyer_folder_batch_contract_baseline.sql"
          cp supabase/migrations/20260828213612_multi_origin_eval_work_folder_completion_v2.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260829042809_itemcode_wide_eval_work.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260830021512_mobile_codex_operations_v1.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260830022003_codex_ops_terra_escalation_v2.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260830023800_codex_ops_access_audit_baseline_v1.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260830213039_eval_work_item_inquiry_row_resolution_v3.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260831004047_eval_work_request_drive_parity.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260831030457_eval_work_multi_assignee_v1.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260831141127_native_auth_profile_link_repair.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260831165043_pikes_orders_manager_history.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260831175530_pikes_orders_access_audit_baseline.sql "$ci_root/supabase/migrations/"
          cp supabase/migrations/20260831181200_optimize_request_read_rls.sql "$ci_root/supabase/migrations/"
