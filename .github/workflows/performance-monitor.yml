name: PWA and Supabase performance

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE*'
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# PR checks run the affected lanes; scheduled and manual checks run every lane.
# Main Pages invokes the same validation workflow in its own publication run.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
      schema: ${{ github.event_name != 'pull_request' || steps.filter.outputs.schema == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            frontend:
              - '{index.html,Code.gs,manifest.json,OneSignalSDKWorker.js,CNAME,assets/**,components/**,styles/**,src/**,v2/**,pages/**,services/**,utils/**,live-src/**,scripts/**,tests/**,.github/**,performance/**,Dockerfile*,package.json,package-lock.json,playwright*.config.*,vite*.config.*,tsconfig*.json,lighthouserc.json}'
            backend:
              - '{supabase/**,migrations/**,database/migrations/**,**/*_migration.sql,deno.lock,deno.json,deno.jsonc,.github/**,package.json,package-lock.json,scripts/**,tests/**}'
            schema:
              - '{supabase/**,migrations/**,database/migrations/**,**/*_migration.sql}'

  validation:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    uses: ./.github/workflows/release-validation.yml
    with:
      fast-pr: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
      run-schema-tests: ${{ github.event_name != 'pull_request' || needs.changes.outputs.schema == 'true' }}
      production-health: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      run-frontend-tests: ${{ github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' }}
      run-backend-tests: ${{ github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true' }}
    secrets: inherit
