name: Finalize verified release

on:
  workflow_run:
    workflows: [Deploy static app to Pages]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: release-finalization-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-dependencies
      - name: Recover unpublished frontend and reconcile verified release state
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/release-evidence
        run: node scripts/recover-or-publish-release.mjs --no-push
      - uses: actions/upload-artifact@v4
        with:
          name: release-state-${{ github.event.workflow_run.head_sha }}
          path: .gnc-local/latest-state.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
