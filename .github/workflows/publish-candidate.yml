name: Publish validated candidate

on:
  workflow_run:
    workflows: [PWA and Supabase performance]
    types: [completed]

# GITHUB_TOKEN merges do not trigger the Pages push workflow. This trusted
# default-branch handler sequences only releases with a dependent frontend;
# other releases keep independent frontend/backend publication.
concurrency:
  group: publish-validated-candidate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # v2.3.11 waits for its backend deployment before dispatching Pages.
    timeout-minutes: 45
    steps:
      # Never check out or execute PR files in this privileged workflow.
      - name: Complete the approved merge and dispatch independent release workflows
        uses: actions/github-script@v7
        with:
          script: |
            const event = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: event.id,
            });
            if (run.path !== '.github/workflows/performance-monitor.yml' ||
                run.event !== 'pull_request' || run.status !== 'completed' ||
                run.conclusion !== 'success' || run.run_attempt !== event.run_attempt ||
                run.head_sha !== event.head_sha || run.head_repository?.full_name !== repository) {
              core.notice('Ignoring an untrusted, incomplete, or superseded validation run.');
              return;
            }

            // workflow_run.pull_requests can be empty after a PR has merged.
            const associated = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: run.head_sha, per_page: 100,
            });
            const candidates = associated.filter(pr =>
              pr.base?.repo?.full_name === repository && pr.base.ref === 'main' &&
              pr.head?.repo?.full_name === repository && pr.head.sha === run.head_sha);
            if (candidates.length !== 1) {
              core.notice('No unique main PR matches this validated head commit.');
              return;
            }
            const pull_number = candidates[0].number;
            let { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pr.draft || pr.base?.repo?.full_name !== repository || pr.base.ref !== 'main' ||
                pr.head?.repo?.full_name !== repository || pr.head.sha !== run.head_sha) {
              core.notice('PR no longer matches the validated candidate.');
              return;
            }
            if (!pr.merged) {
              // Codex candidate branches are merge-authorized only after this
              // exact scoped validation run succeeds. Other branches retain the
              // explicit GitHub Auto-Merge opt-in requirement.
              const validatedCodexCandidate = typeof pr.head?.ref === 'string' &&
                pr.head.ref.startsWith('codex/');
              if (pr.state !== 'open' || (!validatedCodexCandidate && !pr.auto_merge)) {
                core.notice('PR is neither a validated Codex candidate nor awaiting an enabled auto-merge.');
                return;
              }
              const { data: merge } = await github.rest.pulls.merge({
                owner, repo, pull_number, sha: run.head_sha, merge_method: 'merge',
              });
              if (!merge.merged) throw new Error('CANDIDATE_MERGE_NOT_COMPLETED');
              ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number }));
            }
            if (!pr.merged || !pr.merge_commit_sha) throw new Error('CANDIDATE_MERGE_NOT_CONFIRMED');

            const { data: main } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (main.object.sha !== pr.merge_commit_sha) {
              core.notice('A newer main commit will publish through its own validation.');
              return;
            }
            async function dispatchOnce(workflow_id) {
              const existing = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id, head_sha: pr.merge_commit_sha, per_page: 100,
              });
              const reusable = existing.find(candidate => candidate.head_branch === 'main' &&
                  candidate.head_sha === pr.merge_commit_sha && candidate.event === 'workflow_dispatch' &&
                  (candidate.status !== 'completed' || candidate.conclusion === 'success'));
              if (reusable) {
                core.notice(`${workflow_id} is already queued, running, or successful for this merge.`);
                return { run: reusable, previousIds: new Set(existing.map(candidate => candidate.id)) };
              }
              const previousIds = new Set(existing.map(candidate => candidate.id));
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id, ref: 'main',
                inputs: { 'expected-commit': pr.merge_commit_sha },
              });
              return { run: null, previousIds };
            }

            async function waitForSuccessfulWorkflow(workflow_id, dispatch) {
              const deadline = Date.now() + 40 * 60 * 1000;
              let run = dispatch.run;
              while (Date.now() < deadline) {
                if (!run) {
                  const candidates = await github.paginate(github.rest.actions.listWorkflowRuns, {
                    owner, repo, workflow_id, head_sha: pr.merge_commit_sha, per_page: 100,
                  });
                  run = candidates.find(candidate => candidate.head_branch === 'main' &&
                    candidate.head_sha === pr.merge_commit_sha && candidate.event === 'workflow_dispatch' &&
                    !dispatch.previousIds.has(candidate.id));
                }
                if (run) {
                  const { data: latest } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id });
                  if (latest.head_sha !== pr.merge_commit_sha || latest.event !== 'workflow_dispatch') {
                    throw new Error(`BACKEND_RUN_IDENTITY_MISMATCH:${workflow_id}`);
                  }
                  if (latest.status === 'completed') {
                    if (latest.conclusion !== 'success') {
                      throw new Error(`BACKEND_WORKFLOW_FAILED:${workflow_id}:${latest.conclusion}`);
                    }
                    return latest;
                  }
                  run = latest;
                }
                await new Promise(resolve => setTimeout(resolve, 15_000));
              }
              throw new Error(`BACKEND_WORKFLOW_TIMEOUT:${workflow_id}`);
            }

            const packageResponse = await github.rest.repos.getContent({
              owner, repo, path: 'package.json', ref: pr.merge_commit_sha,
            });
            const packageBytes = Buffer.from(packageResponse.data.content, 'base64');
            const packageConfig = JSON.parse(packageBytes.toString('utf8'));
            const releaseVersion = packageConfig.version;
            const scopedAppsScriptRelease = Boolean(packageConfig.scopedValidationReceipt &&
              Array.isArray(packageConfig.appsScriptPatchFunctions) && packageConfig.appsScriptPatchFunctions.length > 0);
            if (releaseVersion === '2.3.11') {
              // This frontend requires the canonical access-control schema and
              // RPCs. Keep Pages unpublished until that exact merge is deployed.
              const backendDispatch = await dispatchOnce('apps-script-sync.yml');
              const backendRun = await waitForSuccessfulWorkflow('apps-script-sync.yml', backendDispatch);
              core.notice(`Backend publication succeeded for ${pr.merge_commit_sha} (run ${backendRun.id}); dispatching Pages.`);
              await dispatchOnce('pages-static.yml');
              core.notice(`Dispatched frontend publication for PR #${pull_number}, merge ${pr.merge_commit_sha}.`);
            } else if (scopedAppsScriptRelease) {
              // The scoped Pages workflow is already queued after backend dispatch;
              // explicitly publish the allowlisted Apps Script functions before its gate completes.
              const backendDispatch = await dispatchOnce('apps-script-sync.yml');
              const backendRun = await waitForSuccessfulWorkflow('apps-script-sync.yml', backendDispatch);
              core.notice(`Backend publication succeeded for ${pr.merge_commit_sha} (run ${backendRun.id}); dispatching guarded Apps Script and Pages.`);
              await dispatchOnce('apps-script-deploy.yml');
              await dispatchOnce('pages-static.yml');
              core.notice(`Dispatched Apps Script and frontend publication for PR #${pull_number}, merge ${pr.merge_commit_sha}.`);
            } else {
              // Existing releases retain their independent publication order.
              await dispatchOnce('pages-static.yml');
              core.notice(`Dispatched frontend publication for PR #${pull_number}, merge ${pr.merge_commit_sha}.`);
              try {
                await dispatchOnce('apps-script-sync.yml');
              } catch {
                core.warning('BACKEND_DISPATCH_FAILED: frontend publication is already queued; backend can be dispatched independently.');
              }
            }
