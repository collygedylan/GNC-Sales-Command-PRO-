name: Deploy Supabase backend

on:
  workflow_dispatch:
    inputs:
      expected-commit:
        description: Optional merged main commit SHA expected by the caller.
        required: false
        type: string
      migrations:
        description: JSON array of migrations selected from the coordinator's exact commit range.
        required: false
        type: string
      edge-functions:
        description: JSON array of Edge Functions selected from the coordinator's exact commit range.
        required: false
        type: string
      supabase-changed:
        description: Whether the exact coordinator change range contains deployable Supabase changes.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: supabase-backend-deploy
  cancel-in-progress: false

jobs:
  authorize-backend:
    name: Authorize current main backend changes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.guard.outputs.authorized }}
      backend-changed: ${{ steps.scope.outputs.backend-changed }}
      migrations: ${{ steps.scope.outputs.migrations }}
      edge-functions: ${{ steps.scope.outputs.edge-functions }}
    steps:
      - name: Check out current main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current main and expected commit
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected-commit }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          [[ "$current_main" == "$GITHUB_SHA" ]] || { echo 'BACKEND_DISPATCH_STALE_MAIN'; exit 1; }
          if [[ -n "$EXPECTED_COMMIT" ]]; then
            [[ "$EXPECTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'EXPECTED_COMMIT_INVALID'; exit 1; }
            [[ "$EXPECTED_COMMIT" == "$GITHUB_SHA" ]] || { echo 'EXPECTED_COMMIT_MISMATCH'; exit 1; }
          fi
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

      - name: Require changed Supabase or database paths
        id: scope
        env:
          INPUT_MIGRATIONS: ${{ inputs.migrations }}
          INPUT_EDGE_FUNCTIONS: ${{ inputs.edge-functions }}
          INPUT_SUPABASE_CHANGED: ${{ inputs.supabase-changed }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { changedReleasePaths, classifyReleasePaths } from './scripts/release-scope.mjs';
          const commit = process.env.RELEASE_COMMIT;
          const parent = execFileSync('git', ['rev-parse', `${commit}^1`], { encoding: 'utf8' }).trim();
          const paths = changedReleasePaths({ before: parent, after: commit });
          const scope = classifyReleasePaths(paths);
          const parseArray = (value, fallback, name) => {
            if (!value) return fallback;
            let parsed;
            try { parsed = JSON.parse(value); } catch { throw new Error(`${name}_JSON_INVALID`); }
            if (!Array.isArray(parsed)) throw new Error(`${name}_ARRAY_INVALID`);
            return parsed;
          };
          const migrationPaths = parseArray(process.env.INPUT_MIGRATIONS, scope.migrations, 'MIGRATIONS');
          const migrations = migrationPaths.map(value => String(value).replaceAll('\\', '/').replace(/^\.\//, '')).sort();
          if (migrations.some(value => value.includes('..') || value.startsWith('/')
            || !/^(?:supabase\/migrations|supabase\/archive_migrations|database(?:\/migrations)?)\/[^/]+\.sql$/i.test(value))) {
            throw new Error('RELEASE_MIGRATION_INPUT_INVALID');
          }
          const tracked = execFileSync('git', ['ls-tree', '-r', '--name-only', commit, 'supabase/functions'], { encoding: 'utf8' });
          let edgeFunctions = parseArray(process.env.INPUT_EDGE_FUNCTIONS, scope.edgeFunctions, 'EDGE_FUNCTIONS');
          if (edgeFunctions.includes('*')) edgeFunctions = [...new Set(tracked.split(/\r?\n/)
            .map(file => /^supabase\/functions\/([^/]+)\//.exec(file)?.[1]).filter(name => name && name !== '_shared'))].sort();
          const available = new Set(tracked.split(/\r?\n/).map(file => /^supabase\/functions\/([^/]+)\//.exec(file)?.[1]).filter(Boolean));
          if (edgeFunctions.some(name => typeof name !== 'string' || !available.has(name) || name === '_shared')) {
            throw new Error('EDGE_FUNCTION_SELECTION_INVALID');
          }
          const explicit = process.env.INPUT_MIGRATIONS !== '' || process.env.INPUT_EDGE_FUNCTIONS !== ''
            || process.env.INPUT_SUPABASE_CHANGED === 'true';
          const backendChanged = explicit
            ? process.env.INPUT_SUPABASE_CHANGED === 'true' || migrations.length > 0 || edgeFunctions.length > 0
            : scope.deploy.supabase;
          appendFileSync(process.env.GITHUB_OUTPUT,
            `backend-changed=${backendChanged}\nmigrations=${JSON.stringify(migrations)}\nedge-functions=${JSON.stringify(edgeFunctions)}\n`);
          console.log(`Backend scope: changed=${backendChanged}, migrations=${migrations.length}, Edge Functions=${edgeFunctions.length}.`);
          NODE

  deploy-supabase:
    name: Apply backend migrations and deploy Edge Functions
    needs: authorize-backend
    if: needs.authorize-backend.result == 'success' && needs.authorize-backend.outputs.authorized == 'true' && needs.authorize-backend.outputs.backend-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out the authorized main release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Recheck exact current main before backend changes
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected-commit }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          [[ "$current_main" == "$GITHUB_SHA" ]] || { echo 'BACKEND_DISPATCH_STALE_MAIN'; exit 1; }
          if [[ -n "$EXPECTED_COMMIT" && "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo 'EXPECTED_COMMIT_MISMATCH' >&2
            exit 1
          fi

      - name: Install locked backend dependencies
        uses: ./.github/actions/setup-node-dependencies
        with:
          node-version: 20

      - name: Apply validated backend release migrations
        if: needs.authorize-backend.outputs.migrations != '[]'
        env:
          RELEASE_MIGRATIONS: ${{ needs.authorize-backend.outputs.migrations }}
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          project_ref="${SUPABASE_URL#https://}"
          project_ref="${project_ref%.supabase.co}"
          [[ "$project_ref" =~ ^[a-z0-9]{20}$ ]] || { echo 'SUPABASE_PROJECT_REF_INVALID'; exit 1; }
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          mkdir -p supabase/.temp
          printf '%s' "$project_ref" > supabase/.temp/project-ref
          SUPABASE_DB_PASSWORD="$(node --input-type=module -e '
            import { validateDatabaseTarget } from "./scripts/apply-item-low-stock-migration.mjs";
            const url = validateDatabaseTarget(process.env.SUPABASE_DB_URL, process.env.SUPABASE_URL);
            process.stdout.write(decodeURIComponent(new URL(url).password));
          ')"
          export SUPABASE_DB_PASSWORD
          if ! link_output="$(supabase link --project-ref "$project_ref" 2>&1)"; then
            if grep -Eiq 'IPv6 is not supported|IPv4 connection' <<<"$link_output"; then
              echo 'SUPABASE_LINK_IPV4_POOLER_FAILED' >&2
            elif grep -Eiq 'password|authentication failed|permission denied' <<<"$link_output"; then
              echo 'SUPABASE_LINK_DATABASE_AUTH_FAILED' >&2
            else
              echo 'SUPABASE_LINK_FAILED' >&2
            fi
            exit 1
          fi
          unset link_output
          node scripts/apply-item-low-stock-migration.mjs
          unset SUPABASE_DB_PASSWORD

      - name: Deploy changed Edge Functions
        if: needs.authorize-backend.outputs['edge-functions'] != '[]'
        env:
          RELEASE_EDGE_FUNCTIONS: ${{ needs.authorize-backend.outputs['edge-functions'] }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          project_ref="${SUPABASE_URL#https://}"
          project_ref="${project_ref%.supabase.co}"
          [[ "$project_ref" =~ ^[a-z0-9]{20}$ ]] || { echo 'SUPABASE_PROJECT_REF_INVALID'; exit 1; }
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          deploy_with_retry() {
            local attempt output status
            for attempt in 1 2; do
              if output=$("$@" 2>&1); then
                printf '%s\n' "$output"
                return 0
              else
                status=$?
                printf '%s\n' "$output"
              fi
              if [[ "$attempt" -eq 2 ]] || ! grep -Eq 'unexpected deploy status (500|502|503|504)' <<< "$output"; then
                return "$status"
              fi
              echo "SUPABASE_DEPLOY_TRANSIENT_RETRY attempt=$attempt"
              sleep "$((attempt * 5))"
            done
          }
          mapfile -t selected_functions < <(node --input-type=module -e "for (const name of JSON.parse(process.env.RELEASE_EDGE_FUNCTIONS)) console.log(name)")
          for function_name in "${selected_functions[@]}"; do
            if [[ "$function_name" == 'app-api' || "$function_name" == 'aura-llm-router' ]]; then
              deploy_with_retry supabase functions deploy "$function_name" --use-api --no-verify-jwt --project-ref "$project_ref"
            else
              deploy_with_retry supabase functions deploy "$function_name" --use-api --project-ref "$project_ref"
            fi
          done

      - name: Verify deployed Aura authorization
        if: contains(needs.authorize-backend.outputs['edge-functions'], 'aura-query')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: node scripts/aura-query-production-smoke.mjs

      - name: Verify Aura Gemini readiness
        # Preserve the approved Gemini timeout bypass for core releases.
        if: ${{ false }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/aura-provider-readiness.mjs
