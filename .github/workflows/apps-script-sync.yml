name: Sync Code.gs to Apps Script

on:
  push:
    branches:
      - main
    paths:
      - Code.gs
      - scripts/apps-script-sync-lib.mjs
      - scripts/apps-script-sync-preflight.mjs
      - scripts/apps-script-recovery-evidence.mjs
      - scripts/lib/production-release-guard.mjs
      - scripts/release-proof.mjs
      - scripts/pages-release.mjs
      - scripts/sync-codegs-to-apps-script.js
      - scripts/apply-item-low-stock-migration.mjs
      - supabase/migrations/20261001012038_production_schedule_snapshot_v1.sql
      - supabase/migrations/20261001025638_aura_hr_command_center_v1.sql
      - supabase/functions/app-api/index.ts
      - supabase/functions/send-push-alert/index.ts
      - supabase/functions/calendar-reminder-sweep/index.ts
      - supabase/config.toml
      - .github/workflows/release-database.yml
      - scripts/preview-perennial-assignment.mjs
      - scripts/certs/supabase-prod-ca-2021.crt
      - supabase/archive_migrations/20260928145055_item_low_stock_targets.sql
      - supabase/archive_migrations/20260929013125_perennial_zone_assignment_override.sql
      - supabase/archive_migrations/20260929160000_password_change_profile_reconciliation.sql
      - .github/workflows/apps-script-sync.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: apps-script-codegs-sync
  cancel-in-progress: false

jobs:
  authorize-production:
    name: Authorize exact current-main release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.guard.outputs.authorized }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Require current main and validated sealed candidate proof
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lib/production-release-guard.mjs

      - name: Require backend deployment credentials before production changes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN_REQUIRED'; exit 1; }
          test -n "$SUPABASE_URL" || { echo 'SUPABASE_URL_REQUIRED'; exit 1; }
          test -n "$SUPABASE_DB_URL" || { echo 'SUPABASE_DB_URL_REQUIRED'; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'SUPABASE_SERVICE_ROLE_KEY_REQUIRED'; exit 1; }
          [[ "$APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID" =~ ^AKfy[a-zA-Z0-9_-]+$ ]] || { echo 'APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID_REQUIRED'; exit 1; }

  sync-codegs:
    name: Update Apps Script Code.gs
    needs: authorize-production
    if: needs.authorize-production.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Install Google API client
        run: npm install --no-save googleapis@144.0.0

      - name: Recheck current main and release proof immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lib/production-release-guard.mjs

      - name: Preview perennial policy impact (read only)
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/preview-perennial-assignment.mjs

      - name: Retain sanitized perennial impact preview
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perennial-assignment-preview-${{ github.sha }}
          path: .gnc-local/perennial-assignment-preview.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Apply backend release migrations and synchronize reminder Vault credentials
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/apply-item-low-stock-migration.mjs

      - name: Configure Production Schedule dispatch and deploy backend functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          project_ref="${SUPABASE_URL#https://}"
          project_ref="${project_ref%.supabase.co}"
          [[ "$project_ref" =~ ^[a-z0-9]{20}$ ]] || { echo 'SUPABASE_PROJECT_REF_INVALID'; exit 1; }
          web_app_url="https://script.google.com/macros/s/${APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID}/exec"
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          supabase secrets set "APPS_SCRIPT_WEB_APP_URL=$web_app_url" --project-ref "$project_ref"
          supabase functions deploy app-api --project-ref "$project_ref"
          supabase functions deploy send-push-alert --project-ref "$project_ref"
          supabase functions deploy calendar-reminder-sweep --project-ref "$project_ref"

      - name: Check whether deployed Apps Script already has identical code
        id: compatibility
        env:
          GH_TOKEN: ${{ github.token }}
          APPS_SCRIPT_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_SCRIPT_ID }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          APPS_SCRIPT_PRODUCTION_SCRIPT_ID: ${{ vars.APPS_SCRIPT_PRODUCTION_SCRIPT_ID }}
          APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID }}
        run: node scripts/apps-script-sync-preflight.mjs

      - name: Sync Code.gs into Apps Script
        if: steps.compatibility.outputs.sync-required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          APPS_SCRIPT_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_SCRIPT_ID }}
          APPS_SCRIPT_CLASPRC_JSON: ${{ secrets.APPS_SCRIPT_CLASPRC_JSON }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          APPS_SCRIPT_PRODUCTION_SCRIPT_ID: ${{ vars.APPS_SCRIPT_PRODUCTION_SCRIPT_ID }}
          APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID }}
        run: node scripts/sync-codegs-to-apps-script.js

      - name: Retain sanitized Apps Script recovery evidence
        if: steps.compatibility.outputs.sync-required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-recovery-evidence-${{ github.sha }}
          path: .gnc-local/apps-script-recovery-evidence.json
          if-no-files-found: error
          retention-days: 90

  publish-pages:
    name: Build and publish Pages
    needs: [authorize-production, sync-codegs]
    if: github.ref == 'refs/heads/main' && needs.authorize-production.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out the authorized main release
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify current main before building
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lib/production-release-guard.mjs

      # Workbook imports are user-initiated in Managers > Production Schedule.
      # Code publication must neither start an import nor wait for one to finish.
      - name: Install dependencies and build the complete site
        run: |
          npm ci
          npm run build:pilot-monitoring
          npm run build:live:assets
          npm run build:v2
          node scripts/prepare-release-site.mjs

      - name: Recheck current main and release proof before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lib/production-release-guard.mjs

      - name: Push the verified static site to gh-pages without force
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          repository="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch "$repository" gh-pages:refs/remotes/origin/gh-pages
          pages_dir="$RUNNER_TEMP/gnc-gh-pages"
          git worktree add --detach "$pages_dir" refs/remotes/origin/gh-pages
          rsync -a --delete --exclude='.git' _site/ "$pages_dir/"
          test -f "$pages_dir/CNAME"
          test -f "$pages_dir/.nojekyll"
          git -C "$pages_dir" add -A
          if git -C "$pages_dir" diff --cached --quiet; then
            echo 'GHPAGES_ALREADY_CURRENT'
            exit 0
          fi
          git -C "$pages_dir" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish ${GITHUB_SHA:0:12} to GitHub Pages"
          git -C "$pages_dir" push "$repository" HEAD:gh-pages
