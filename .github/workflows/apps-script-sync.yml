name: Sync Code.gs to Apps Script

on:
  push:
    branches:
      - main
    paths:
      - Code.gs
      - scripts/apps-script-sync-lib.mjs
      - scripts/apps-script-sync-preflight.mjs
      - scripts/apps-script-recovery-evidence.mjs
      - scripts/lib/production-release-guard.mjs
      - scripts/release-proof.mjs
      - scripts/pages-release.mjs
      - scripts/sync-codegs-to-apps-script.js
      - scripts/apply-item-low-stock-migration.mjs
      - supabase/migrations/20260928145055_item_low_stock_targets.sql
      - .github/workflows/apps-script-sync.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: apps-script-codegs-sync
  cancel-in-progress: false

jobs:
  authorize-production:
    name: Authorize exact current-main release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.guard.outputs.authorized }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Require current main and validated sealed candidate proof
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lib/production-release-guard.mjs

  sync-codegs:
    name: Update Apps Script Code.gs
    needs: authorize-production
    if: needs.authorize-production.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Google API client
        run: npm install --no-save googleapis@144.0.0

      - name: Recheck current main and release proof immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lib/production-release-guard.mjs

      - name: Apply the item low-stock schema before the compatible importer
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/apply-item-low-stock-migration.mjs

      - name: Check whether deployed Apps Script already has identical code
        id: compatibility
        env:
          GH_TOKEN: ${{ github.token }}
          APPS_SCRIPT_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_SCRIPT_ID }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          APPS_SCRIPT_PRODUCTION_SCRIPT_ID: ${{ vars.APPS_SCRIPT_PRODUCTION_SCRIPT_ID }}
          APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID }}
        run: node scripts/apps-script-sync-preflight.mjs

      - name: Sync Code.gs into Apps Script
        if: steps.compatibility.outputs.sync-required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          APPS_SCRIPT_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_SCRIPT_ID }}
          APPS_SCRIPT_CLASPRC_JSON: ${{ secrets.APPS_SCRIPT_CLASPRC_JSON }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          APPS_SCRIPT_PRODUCTION_SCRIPT_ID: ${{ vars.APPS_SCRIPT_PRODUCTION_SCRIPT_ID }}
          APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID }}
        run: node scripts/sync-codegs-to-apps-script.js

      - name: Retain sanitized Apps Script recovery evidence
        if: steps.compatibility.outputs.sync-required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-recovery-evidence-${{ github.sha }}
          path: .gnc-local/apps-script-recovery-evidence.json
          if-no-files-found: error
          retention-days: 90

  publish-pages:
    name: Hand off the compatible backend to Pages
    needs: [authorize-production, sync-codegs]
    if: github.ref == 'refs/heads/main' && needs.authorize-production.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch Pages only after verified backend deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: main } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (main.object.sha !== context.sha) {
              core.notice('Main advanced while deploying the backend; its newer release owns publication.');
              return;
            }
            const existing = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'pages-static.yml', head_sha: context.sha, per_page: 100,
            });
            if (existing.some(run => run.head_branch === 'main' && run.head_sha === context.sha &&
                (run.status !== 'completed' || run.conclusion === 'success'))) {
              core.notice('Pages is already queued, running, or successful for this merge.');
              return;
            }
            // Recheck after the run lookup; Pages also checks current main and
            // independently verifies the sealed proof before publication.
            const { data: latestMain } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (latestMain.object.sha !== context.sha) {
              core.notice('Main advanced before Pages dispatch.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'pages-static.yml', ref: 'main',
            });
            core.notice(`Dispatched Pages after compatible backend deployment for ${context.sha}.`);
