name: Deploy Supabase backend

on:
  workflow_dispatch:
    inputs:
      expected-commit:
        description: Optional merged main commit SHA expected by the caller.
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: supabase-backend-deploy
  cancel-in-progress: false

jobs:
  authorize-backend:
    name: Authorize current main backend changes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.guard.outputs.authorized }}
      backend-changed: ${{ steps.scope.outputs.backend-changed }}
      v238: ${{ steps.scope.outputs.v238 }}
      v2311: ${{ steps.scope.outputs.v2311 }}
      v2313: ${{ steps.scope.outputs.v2313 }}
      scoped: ${{ steps.scope.outputs.scoped }}
    steps:
      - name: Check out current main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current main and expected commit
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected-commit }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          [[ "$current_main" == "$GITHUB_SHA" ]] || { echo 'BACKEND_DISPATCH_STALE_MAIN'; exit 1; }
          if [[ -n "$EXPECTED_COMMIT" ]]; then
            [[ "$EXPECTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'EXPECTED_COMMIT_INVALID'; exit 1; }
            [[ "$EXPECTED_COMMIT" == "$GITHUB_SHA" ]] || { echo 'EXPECTED_COMMIT_MISMATCH'; exit 1; }
          fi
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

      - name: Require changed Supabase or database paths
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify "${GITHUB_SHA}^1" >/dev/null 2>&1; then
            echo 'BACKEND_PATH_COMPARISON_FAILED' >&2
            exit 1
          fi
          diff_file="$RUNNER_TEMP/backend-paths.nul"
          if ! git diff --name-only --no-renames -z --diff-filter=ACMRD "${GITHUB_SHA}^1" "$GITHUB_SHA" > "$diff_file"; then
            echo 'BACKEND_PATH_COMPARISON_FAILED' >&2
            exit 1
          fi
          mapfile -d '' -t changed_files < "$diff_file"
          backend_changed=false
          for changed_file in "${changed_files[@]}"; do
            case "$changed_file" in
              supabase/*|database/*|scripts/apply-item-low-stock-migration.mjs|.github/workflows/apps-script-sync.yml) backend_changed=true ;;
            esac
          done
          echo "backend-changed=$backend_changed" >> "$GITHUB_OUTPUT"
          echo "scoped=$(test -n "$(jq -r '.scopedValidationReceipt // empty' package.json)" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "v2313=$(test "$(jq -r .version package.json)" = 2.3.13 && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "v2311=$(test "$(jq -r .version package.json)" = 2.3.11 && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [[ "$(jq -r '.version' package.json)" == '2.3.8' ]]; then
            echo 'v238=true' >> "$GITHUB_OUTPUT"
          else
            echo 'v238=false' >> "$GITHUB_OUTPUT"
          fi

  backend-validation:
    name: Validate backend schema and transactions before deployment
    needs: authorize-backend
    if: needs.authorize-backend.outputs.authorized == 'true' && needs.authorize-backend.outputs.backend-changed == 'true'
    uses: ./.github/workflows/release-database.yml
    with:
      run-schema-tests: true
      run-browser-tests: false
      run-performance-tests: false
      run-all-schema-tests: true

  pending-order-contract:
    needs: [authorize-backend, backend-validation]
    if: needs.authorize-backend.outputs.authorized == 'true' && needs.authorize-backend.outputs.backend-changed == 'true' && needs.authorize-backend.outputs.v238 != 'true' && needs.authorize-backend.outputs.v2311 != 'true' && needs.authorize-backend.outputs.v2313 != 'true' && needs.authorize-backend.outputs.scoped != 'true'
    uses: ./.github/workflows/bloomscapes-pending-tests.yml

  suspend-tag-contract:
    needs: [authorize-backend, backend-validation]
    if: needs.authorize-backend.outputs.authorized == 'true' && needs.authorize-backend.outputs.backend-changed == 'true' && needs.authorize-backend.outputs.v238 != 'true' && needs.authorize-backend.outputs.v2311 != 'true' && needs.authorize-backend.outputs.v2313 != 'true' && needs.authorize-backend.outputs.scoped != 'true'
    uses: ./.github/workflows/suspend-tag-tests.yml

  live-dataset-contract:
    needs: [authorize-backend, backend-validation]
    if: needs.authorize-backend.outputs.authorized == 'true' && needs.authorize-backend.outputs.backend-changed == 'true' && needs.authorize-backend.outputs.v238 != 'true' && needs.authorize-backend.outputs.v2311 != 'true' && needs.authorize-backend.outputs.v2313 != 'true' && needs.authorize-backend.outputs.scoped != 'true'
    uses: ./.github/workflows/live-dataset-revisions.yml

  v238-retained-contracts:
    name: Verify scoped database contract receipts
    needs: [authorize-backend, backend-validation]
    if: needs.authorize-backend.outputs.authorized == 'true' && needs.authorize-backend.outputs.backend-changed == 'true' && (needs.authorize-backend.outputs.v238 == 'true' || needs.authorize-backend.outputs.v2311 == 'true' || needs.authorize-backend.outputs.v2313 == 'true' || needs.authorize-backend.outputs.scoped == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install locked checker dependencies
        uses: ./.github/actions/setup-node-dependencies
      - name: Require exact retained pending-order and live-dataset contract hashes
        run: |
          node --input-type=module <<'NODE'
          import { verifyV2311RetainedValidation } from './scripts/check-v2311-retained-validation.mjs';
          import fs from 'node:fs';
          import { verifyV2313RetainedValidation } from './scripts/check-v2313-retained-validation.mjs';
          import { verifyScopedRetainedValidation } from './scripts/check-retained-release-validation.mjs';
          if (JSON.parse(fs.readFileSync('package.json', 'utf8')).scopedValidationReceipt) {
            verifyScopedRetainedValidation();
            console.log('PASS source-sealed scoped SQL, email, Edge and browser validation evidence');
            process.exit(0);
          }
          if (JSON.parse(fs.readFileSync('package.json', 'utf8')).version === '2.3.13') {
            verifyV2313RetainedValidation();
            console.log('PASS v2.3.13 native PostgreSQL staging and atomic publication evidence');
            process.exit(0);
          }
          if (JSON.parse(fs.readFileSync('package.json', 'utf8')).version === '2.3.11') {
            verifyV2311RetainedValidation();
            console.log('PASS v2.3.11 exact source-sealed disposable SQL and delivery contracts');
            process.exit(0);
          }
          import { verifyV238RetainedValidation } from './scripts/check-v238-retained-validation.mjs';
          const receipt = verifyV238RetainedValidation({ rootDir: process.cwd() });
          if (receipt.canRetainPendingOrderContract !== true) throw new Error('V238_PENDING_ORDER_CONTRACT_NOT_RETAINABLE');
          if (receipt.canRetainLiveDatasetContract !== true) throw new Error('V238_LIVE_DATASET_CONTRACT_NOT_RETAINABLE');
          console.log('PASS retained pending-order and live-dataset contracts match their verified baseline hashes');
          NODE

  deploy-supabase:
    name: Apply backend migrations and deploy Edge Functions
    needs: [authorize-backend, backend-validation, pending-order-contract, suspend-tag-contract, live-dataset-contract, v238-retained-contracts]
    if: always() && needs.authorize-backend.outputs.authorized == 'true' && needs.authorize-backend.outputs.backend-changed == 'true' && needs.backend-validation.result == 'success' && (((needs.authorize-backend.outputs.v238 == 'true' || needs.authorize-backend.outputs.v2311 == 'true' || needs.authorize-backend.outputs.v2313 == 'true' || needs.authorize-backend.outputs.scoped == 'true') && needs.v238-retained-contracts.result == 'success' && needs.pending-order-contract.result == 'skipped' && needs.suspend-tag-contract.result == 'skipped' && needs.live-dataset-contract.result == 'skipped') || (needs.authorize-backend.outputs.v238 != 'true' && needs.authorize-backend.outputs.v2311 != 'true' && needs.authorize-backend.outputs.v2313 != 'true' && needs.authorize-backend.outputs.scoped != 'true' && needs.v238-retained-contracts.result == 'skipped' && needs.pending-order-contract.result == 'success' && needs.suspend-tag-contract.result == 'success' && needs.live-dataset-contract.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out the authorized main release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Recheck exact current main before backend changes
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected-commit }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          [[ "$current_main" == "$GITHUB_SHA" ]] || { echo 'BACKEND_DISPATCH_STALE_MAIN'; exit 1; }
          if [[ -n "$EXPECTED_COMMIT" && "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo 'EXPECTED_COMMIT_MISMATCH' >&2
            exit 1
          fi

      - name: Install locked backend dependencies
        uses: ./.github/actions/setup-node-dependencies

      - name: Apply validated backend release migrations
        env:
          V2313_SCOPED_DEPLOY: ${{ needs.authorize-backend.outputs.v2313 }}
          SCOPED_RELEASE_DEPLOY: ${{ needs.authorize-backend.outputs.scoped }}
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/apply-item-low-stock-migration.mjs

      - name: Configure Production Schedule dispatch and deploy backend functions
        if: needs.authorize-backend.outputs.v2313 != 'true' || needs.authorize-backend.outputs.scoped == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID }}
          V238_SCOPED_DEPLOY: ${{ needs.authorize-backend.outputs.v238 }}
          V2311_SCOPED_DEPLOY: ${{ needs.authorize-backend.outputs.v2311 }}
          SCOPED_RELEASE_DEPLOY: ${{ needs.authorize-backend.outputs.scoped }}
        shell: bash
        run: |
          set -euo pipefail
          project_ref="${SUPABASE_URL#https://}"
          project_ref="${project_ref%.supabase.co}"
          [[ "$project_ref" =~ ^[a-z0-9]{20}$ ]] || { echo 'SUPABASE_PROJECT_REF_INVALID'; exit 1; }
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          deploy_with_retry() {
            local attempt output status
            for attempt in 1 2; do
              if output=$("$@" 2>&1); then
                printf '%s\n' "$output"
                return 0
              else
                status=$?
                printf '%s\n' "$output"
              fi
              if [[ "$attempt" -eq 2 ]] || ! grep -Eq 'unexpected deploy status (500|502|503|504)' <<< "$output"; then
                return "$status"
              fi
              echo "SUPABASE_DEPLOY_TRANSIENT_RETRY attempt=$attempt"
              sleep "$((attempt * 5))"
            done
          }
          if [[ "$SCOPED_RELEASE_DEPLOY" == 'true' ]]; then
            mapfile -t scoped_functions < <(node --input-type=module -e "import {verifyScopedRetainedValidation} from './scripts/check-retained-release-validation.mjs'; for (const name of verifyScopedRetainedValidation().deployment.edgeFunctions) console.log(name)")
            for function_name in "${scoped_functions[@]}"; do
              deploy_with_retry supabase functions deploy "$function_name" --use-api --project-ref "$project_ref"
            done
          elif [[ "$V2311_SCOPED_DEPLOY" == 'true' ]]; then
            deploy_with_retry supabase functions deploy app-api --use-api --project-ref "$project_ref"
            deploy_with_retry supabase functions deploy request-delivery-worker --use-api --project-ref "$project_ref"
          elif [[ "$V238_SCOPED_DEPLOY" == 'true' ]]; then
            deploy_with_retry supabase functions deploy app-api --use-api --project-ref "$project_ref"
            deploy_with_retry supabase functions deploy request-delivery-worker --use-api --project-ref "$project_ref"
            deploy_with_retry supabase functions deploy send-push-alert --use-api --project-ref "$project_ref"
          else
            [[ "$APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID" =~ ^AKfy[a-zA-Z0-9_-]+$ ]] || { echo 'APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID_REQUIRED'; exit 1; }
            web_app_url="https://script.google.com/macros/s/${APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID}/exec"
            supabase secrets set "APPS_SCRIPT_WEB_APP_URL=$web_app_url" --project-ref "$project_ref"
            deploy_with_retry supabase functions deploy app-api --use-api --project-ref "$project_ref"
            deploy_with_retry supabase functions deploy request-delivery-worker --use-api --project-ref "$project_ref"
            deploy_with_retry supabase functions deploy send-push-alert --use-api --project-ref "$project_ref"
            deploy_with_retry supabase functions deploy calendar-reminder-sweep --use-api --project-ref "$project_ref"
            deploy_with_retry supabase functions deploy scheduled-offboarding --use-api --project-ref "$project_ref"
            deploy_with_retry supabase functions deploy auth-admin --use-api --project-ref "$project_ref"
            deploy_with_retry supabase functions deploy inventory-assistant --use-api --project-ref "$project_ref"
            deploy_with_retry supabase functions deploy aura-query --use-api --project-ref "$project_ref"
            deploy_with_retry supabase functions deploy aura-llm-router --use-api --project-ref "$project_ref"
          fi

      - name: Verify deployed Aura authorization
        if: needs.authorize-backend.outputs.v2313 != 'true' && needs.authorize-backend.outputs.scoped != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: node scripts/aura-query-production-smoke.mjs

      - name: Verify Aura Gemini readiness
        # Preserve the approved Gemini timeout bypass for core releases.
        if: ${{ false }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/aura-provider-readiness.mjs
