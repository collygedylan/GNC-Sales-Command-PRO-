name: Suspend Tag completion transaction tests
on:
  pull_request:
    paths:
      - 'supabase/archive_migrations/*suspend_tag*'
      - 'supabase/migrations/*suspend_tag*'
      - 'supabase/tests/suspend_tag*'
      - 'supabase/ci/suspend_tag*'
      - '.github/workflows/suspend-tag-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: suspend-tag-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suspend-tag-transactions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: suspend_tag_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable_ci_only
      PGDATABASE: suspend_tag_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-dependencies
      - name: Verify protected completion on isolated PostgreSQL without production access
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/ci/suspend_tag_baseline.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/archive_migrations/20260908165943_suspend_tag_completion.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/suspend_tag_completion_test.sql
          node scripts/run-discovered-database-tests.mjs suspend-tag-concurrency
      - name: Verify approval permissions and lifecycle in a separate disposable database
        run: |
          createdb suspend_tag_approval_test
          PGDATABASE=suspend_tag_approval_test node scripts/run-discovered-tests.mjs postgres-runtime
