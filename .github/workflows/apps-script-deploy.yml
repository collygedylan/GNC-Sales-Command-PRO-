name: Deploy Apps Script ingestion

on:
  workflow_dispatch:
    inputs:
      expected-commit:
        description: Merged main SHA supplied by the trusted publisher.
        type: string
        required: true
      backend-run-id:
        description: Exact successful backend coordinator run.
        type: string
        required: true
      backend-run-attempt:
        description: Exact backend run attempt.
        type: string
        required: true
      coordinator-run-id:
        description: Exact Pages coordinator run authorizing this deployment.
        type: string
        required: true
      coordinator-run-attempt:
        description: Exact Pages coordinator attempt.
        type: string
        required: true
      supabase-required:
        description: Whether the validated coordinator scope requires a successful Supabase deployment.
        type: boolean
        required: true
        default: false
      script-changed:
        description: Whether the validated coordinator scope includes Apps Script source.
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: apps-script-production-deploy
  cancel-in-progress: false

jobs:
  deploy-apps-script:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_COMMIT: ${{ inputs.expected-commit }}
      APPS_SCRIPT_BACKEND_RUN_ID: ${{ inputs.backend-run-id }}
      APPS_SCRIPT_BACKEND_RUN_ATTEMPT: ${{ inputs.backend-run-attempt }}
      APPS_SCRIPT_BACKEND_RUN_SHA: ${{ github.sha }}
      APPS_SCRIPT_COORDINATOR_RUN_ID: ${{ inputs.coordinator-run-id }}
      APPS_SCRIPT_COORDINATOR_RUN_ATTEMPT: ${{ inputs.coordinator-run-attempt }}
      APPS_SCRIPT_SUPABASE_REQUIRED: ${{ inputs.supabase-required }}
      APPS_SCRIPT_SCRIPT_CHANGED: ${{ inputs.script-changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-dependencies
      - name: Authorize current merged main and standard PR validation
        id: authorize
        run: node scripts/lib/apps-script-deployment-guard.mjs
      - name: Publish the guarded production Apps Script version
        if: steps.authorize.outputs.script-changed == 'true'
        env:
          APPS_SCRIPT_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_SCRIPT_ID }}
          APPS_SCRIPT_CLASPRC_JSON: ${{ secrets.APPS_SCRIPT_CLASPRC_JSON }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_PRODUCTION_DEPLOYMENT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-codegs-to-apps-script.js
      - name: Retain Apps Script publication evidence
        if: steps.authorize.outputs.script-changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-publication-${{ github.sha }}-${{ github.run_attempt }}
          path: .gnc-local/apps-script-recovery-evidence.json
          if-no-files-found: error
          retention-days: 14
