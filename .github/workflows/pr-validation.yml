name: Validate PR units and lint

on:
  workflow_call:
    inputs:
      run-frontend-tests:
        type: boolean
        default: true
      run-backend-tests:
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-dependencies
      - run: node scripts/prepare-release-version.mjs --check
      - run: npm run check:tooling

  unit:
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-dependencies
      - run: node scripts/run-release-unit-checks.mjs --shard=${{ matrix.shard }}/4

  react:
    if: inputs.run-frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-dependencies
      - run: npm run test:v2

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-dependencies
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node scripts/run-discovered-tests.mjs python

  backend-unit:
    if: inputs.run-backend-tests
    uses: ./.github/workflows/release-database.yml
    with:
      run-schema-tests: false
      run-browser-tests: false
      run-performance-tests: false

  pr-gate:
    if: always()
    needs: [lint, unit, react, contracts, backend-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require the selected unit and lint checks
        env:
          PR_JOB_RESULTS: ${{ toJSON(needs) }}
          RUN_FRONTEND_TESTS: ${{ inputs.run-frontend-tests }}
          RUN_BACKEND_TESTS: ${{ inputs.run-backend-tests }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = JSON.parse(process.env.PR_JOB_RESULTS);
          const required = ['lint', 'unit', 'contracts'];
          if (process.env.RUN_FRONTEND_TESTS === 'true') required.push('react');
          if (process.env.RUN_BACKEND_TESTS === 'true') required.push('backend-unit');
          for (const name of required) {
            if (jobs[name]?.result !== 'success') throw new Error(`PR_GATE_FAILED_${name}`);
          }
          console.log('All selected PR unit and lint checks passed; publication is verified separately on main.');
          NODE
