name: Validate focused PR contracts

on:
  workflow_call:
    inputs:
      run-frontend-tests:
        description: Compatibility scope input; the focused inline and tooling checks always run.
        type: boolean
        default: true
      run-backend-tests:
        description: Compatibility scope input; full backend validation belongs to Nightly Validation.
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  fast-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-dependencies
      - name: Check release version consistency
        run: node scripts/prepare-release-version.mjs --check
      - name: Validate inline application scripts
        run: npm run check:inline
      - name: Run focused release tooling contracts
        run: node scripts/run-tooling-release-checks.mjs
