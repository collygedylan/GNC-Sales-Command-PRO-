name: Validate one immutable release

on:
  workflow_call:
    inputs:
      fast-pr:
        description: One headless Chromium gate; full browser coverage runs on main.
        type: boolean
        default: false
      run-schema-tests:
        type: boolean
        default: true
      production-health:
        type: boolean
        default: false
      run-frontend-tests:
        type: boolean
        default: true
      run-backend-tests:
        type: boolean
        default: true
    outputs:
      digest:
        description: Verified release manifest SHA256
        value: ${{ jobs.build.outputs.digest }}
      run-id:
        description: Workflow run containing the validated release artifacts
        value: ${{ jobs.release-gate.outputs.run-id }}
      attempt:
        description: Validated workflow run attempt
        value: ${{ jobs.release-gate.outputs.attempt }}
      site-id:
        description: Validated site artifact ID
        value: ${{ jobs.release-gate.outputs.site-id }}
      proof-id:
        description: Validated proof artifact ID
        value: ${{ jobs.release-gate.outputs.proof-id }}

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-dependencies
      - run: node scripts/prepare-release-version.mjs --check
      - run: npm run check:inline
        if: inputs.run-frontend-tests
      - run: npm run check:tooling

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-dependencies
      - run: node scripts/run-release-unit-checks.mjs
      - run: npm run test:v2
        if: inputs.run-frontend-tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node scripts/run-discovered-tests.mjs python

  database:
    if: inputs.run-backend-tests
    uses: ./.github/workflows/release-database.yml
    with:
      run-schema-tests: ${{ inputs.run-schema-tests }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      digest: ${{ steps.seal.outputs.digest }}
      artifact-id: ${{ steps.site.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      # Build Cloud handles Docker image builds; Node builds and SQL/browser
      # verification retain their existing GitHub-hosted runners and gates.
      - name: Check Docker Build Cloud credentials
        id: docker-cloud
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PAT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Docker Build Cloud awaits DOCKER_USERNAME and DOCKER_PAT secrets. Existing release validation remains on GitHub runners."
          fi
      - name: Log in to Docker
        if: steps.docker-cloud.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Set up Docker Build Cloud
        if: steps.docker-cloud.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v4
        with:
          version: v0.37.0
          driver: cloud
          endpoint: agmetricapp/greenleaf-ci-builder
      - uses: ./.github/actions/setup-node-dependencies
      - run: npm run build:pilot-monitoring
      - run: npm run build:live:assets
      - run: npm run build:v2
      - run: node scripts/prepare-release-site.mjs
      - id: seal
        run: node scripts/release-artifact.mjs seal
      - id: site
        uses: actions/upload-artifact@v4
        with:
          name: release-site-${{ github.sha }}
          path: _site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  fast-browser:
    if: inputs.run-frontend-tests && inputs.fast-pr
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-tests
        with:
          browsers: chromium
      - uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.build.outputs.digest }}
      - name: Single headless Chromium PR gate
        run: npx playwright test --config playwright.release-functional.config.ts --project=chromium --workers=2 --max-failures=1 --reporter=github
      - name: Verify the sealed package after the PR gate
        env:
          EXPECTED_RELEASE_DIGEST: ${{ needs.build.outputs.digest }}
        run: node scripts/release-artifact.mjs verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pr-chromium-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore

  foundation:
    if: inputs.run-frontend-tests && !inputs.fast-pr && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Browser dependency installation can consume over eight minutes on a cold runner.
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - project: lifecycle-chromium
            browsers: chromium
          - project: lifecycle-iphone
            browsers: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-tests
        with:
          browsers: ${{ matrix.browsers }}
      - uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.build.outputs.digest }}
      - name: Shared lifecycle fault injection
        run: npm run test:foundation -- --project=${{ matrix.project }} --max-failures=1 --reporter=github
      - name: Verify immutable package after foundation checks
        env:
          EXPECTED_RELEASE_DIGEST: ${{ needs.build.outputs.digest }}
        run: node scripts/release-artifact.mjs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-${{ matrix.project }}-${{ github.run_attempt }}
          path: test-results/lifecycle
          if-no-files-found: ignore

  functional:
    if: inputs.run-frontend-tests && !inputs.fast-pr && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # A cold browser install can leave too little of a 15-minute job for the shard.
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        project:
          - chromium
          - firefox
          - webkit
        shard:
          - 1
          - 2
          - 3
          - 4
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-tests
        with:
          browsers: ${{ matrix.project }}
      - uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.build.outputs.digest }}
      - name: Functional browsers, shard ${{ matrix.shard }} of 4
        run: npx playwright test --config playwright.release-functional.config.ts --workers=1 --shard=${{ matrix.shard }}/4 --project=${{ matrix.project }} --max-failures=1 --reporter=github,blob
      - name: Verify tests did not change the release package
        env:
          EXPECTED_RELEASE_DIGEST: ${{ needs.build.outputs.digest }}
        run: node scripts/release-artifact.mjs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-${{ matrix.project }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            blob-report
            test-results
          if-no-files-found: ignore

  compiled:
    if: inputs.run-frontend-tests && !inputs.fast-pr && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - suite: production-requests
            config: playwright.release-canary.config.ts
            project: production-chromium
            browsers: chromium
            shard: 1
            total: 1
          - suite: production-requests
            config: playwright.release-canary.config.ts
            project: production-iphone-webkit
            browsers: webkit
            shard: 1
            total: 1
          - suite: footer
            config: playwright.footer.config.ts
            project: footer-android-chromium
            browsers: chromium
            shard: 1
            total: 1
          - suite: footer
            config: playwright.footer.config.ts
            project: footer-iphone-webkit
            browsers: webkit
            shard: 1
            total: 1
          - suite: footer
            config: playwright.footer.config.ts
            project: footer-desktop-firefox
            browsers: firefox
            shard: 1
            total: 1
          - suite: home
            config: playwright.home-role.config.ts
            project: home-android-chromium
            browsers: chromium
            shard: 1
            total: 2
          - suite: home
