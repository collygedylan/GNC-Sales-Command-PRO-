            config: playwright.hl-restock.config.ts
            project: cache-iphone
            browsers: webkit
            shard: 1
            total: 1
          - suite: stable-refresh
            config: playwright.stable-background-refresh.config.ts
            project: stable-background-desktop
            browsers: chromium
            shard: 1
            total: 1
          - suite: stable-refresh
            config: playwright.stable-background-refresh.config.ts
            project: stable-background-android
            browsers: chromium
            shard: 1
            total: 1
          - suite: stable-refresh
            config: playwright.stable-background-refresh.config.ts
            project: stable-background-iphone
            browsers: webkit
            shard: 1
            total: 1
          - suite: worker-isolation
            config: playwright.sw-isolation.config.ts
            project: sw-isolation-chromium
            browsers: chromium
            shard: 1
            total: 1
          - suite: worker-isolation
            config: playwright.sw-isolation.config.ts
            project: sw-isolation-webkit
            browsers: webkit
            shard: 1
            total: 1
          - suite: partner-workspace
            config: v2/tests/playwright.partner.config.ts
            project: desktop-chromium
            browsers: chromium
            shard: 1
            total: 1
          - suite: partner-workspace
            config: v2/tests/playwright.partner.config.ts
            project: android-chromium
            browsers: chromium
            shard: 1
            total: 1
          - suite: partner-workspace
            config: v2/tests/playwright.partner.config.ts
            project: iphone-webkit
            browsers: webkit
            shard: 1
            total: 1
          - suite: partner-workspace
            config: v2/tests/playwright.partner.config.ts
            project: tablet-webkit
            browsers: webkit
            shard: 1
            total: 1
          - suite: command-center
            project: chromium
            browsers: chromium webkit
            shard: 1
            total: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-tests
        with:
          browsers: ${{ matrix.browsers }}
      - uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.build.outputs.digest }}
      - name: Compiled shell — ${{ matrix.suite }}
        if: matrix.suite != 'command-center'
        run: npx playwright test --config ${{ matrix.config }} --workers=1 --reporter=github,blob --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.total }} --max-failures=1
      - name: AURA command center browser interactions
        if: matrix.suite == 'command-center'
        env:
          GNC_BROWSER_ASSET_ROOT: _site
        run: node scripts/run-discovered-tests.mjs node-browser
      - name: Verify tests did not change the release package
        env:
          EXPECTED_RELEASE_DIGEST: ${{ needs.build.outputs.digest }}
        run: node scripts/release-artifact.mjs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiled-${{ matrix.suite }}-${{ matrix.project }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            blob-report
            test-results
            artifacts
          if-no-files-found: ignore

  timing:
    if: needs.release-mode.outputs.hotfix != 'true' && inputs.run-frontend-tests && inputs.run-nightly-suites && github.ref == 'refs/heads/main' && github.workflow == 'Nightly Validation'
    needs: [build, release-mode]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          - project: chromium
            config: playwright.release-timing.config.ts
            browsers: chromium
          - project: firefox
            config: playwright.release-timing.config.ts
            browsers: firefox
          - project: webkit
            config: playwright.release-timing.config.ts
            browsers: webkit
          - project: android
            config: playwright.release-android.config.ts
            browsers: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-tests
        with:
          browsers: ${{ matrix.browsers }}
      - uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.build.outputs.digest }}
      - name: Scroll and throttled startup on a quiet runner
        run: npx playwright test --config ${{ matrix.config }} --workers=1 --project=${{ matrix.project }} --max-failures=1
      - name: Verify isolated preview blocks production requests
        if: matrix.project == 'chromium'
        run: node scripts/check-isolated-preview.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: timing-diagnostics-${{ matrix.project }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore

  performance:
    if: needs.release-mode.outputs.hotfix != 'true' && inputs.run-frontend-tests && inputs.run-nightly-suites && github.ref == 'refs/heads/main' && github.workflow == 'Nightly Validation'
    needs: [build, release-mode]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-browser-tests
        with:
          browsers: chromium
      - uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.build.outputs.digest }}
      - name: Require review for changes to the pinned performance baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-performance-baseline-review.mjs
      - name: Restore immutable reviewed performance baseline
        uses: actions/cache@v4
        with:
          path: .gnc-local/performance-baseline-*/_site
          key: performance-baseline-v1-${{ runner.os }}-${{ hashFiles('performance/baseline.json', 'package-lock.json', 'scripts/build-performance-baseline.mjs') }}
      - name: Build or verify the pinned historical baseline
        run: node scripts/build-performance-baseline.mjs
      - name: Compare cold and warm routes serially on the same runner
        run: node scripts/run-performance-browser.mjs
      - name: Verify benchmark did not mutate the candidate artifact
        env:
          EXPECTED_RELEASE_DIGEST: ${{ needs.build.outputs.digest }}
        run: node scripts/release-artifact.mjs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ github.run_attempt }}
          path: artifacts/performance
          if-no-files-found: error

  lighthouse:
    if: needs.release-mode.outputs.hotfix != 'true' && inputs.run-frontend-tests && inputs.run-nightly-suites && github.ref == 'refs/heads/main' && github.workflow == 'Nightly Validation'
    needs: [build, release-mode]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-tests
        with:
          browsers: chromium
      - name: Prepare static shell for Lighthouse — verify, never rebuild
        uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.build.outputs.digest }}
      - name: Lighthouse on a quiet runner with bounded protocol retry
        run: node scripts/run-release-lighthouse.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-${{ github.run_attempt }}
          path: .lighthouseci*
          include-hidden-files: true
          if-no-files-found: ignore

  production-health:
    needs: release-mode
    if: needs.release-mode.outputs.hotfix != 'true' && inputs.production-health
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe production login bridge and Data API
        env:
          PRODUCTION_PROBE_READ_ONLY: '1'
          PRODUCTION_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUEST_DELIVERY_CRON_SECRET: ${{ secrets.REQUEST_DELIVERY_CRON_SECRET }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          REQUIRE_APPS_SCRIPT_HEALTH: '1'
          REQUIRE_BOUNDED_MAINTENANCE: '1'
        run: node scripts/probe-production-auth-health.mjs

  release-gate:
    if: always()
    needs: [release-mode, lint, unit, react, contracts, database, build, fast-browser, foundation, functional, compiled, timing, performance, lighthouse]
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ github.run_id }}
      attempt: ${{ github.run_attempt }}
      site-id: ${{ needs.build.outputs.artifact-id }}
      proof-id: ${{ steps.proof.outputs.artifact-id }}
      digest: ${{ needs.build.outputs.digest }}
    steps:
      - name: Require every safety lane for this commit
        env:
          HOTFIX: ${{ needs.release-mode.outputs.hotfix }}
          RELEASE_JOB_RESULTS: ${{ toJSON(needs) }}
          RUN_NIGHTLY_SUITES: ${{ inputs.run-nightly-suites }}
          RUN_SCHEMA_TESTS: ${{ inputs.run-schema-tests }}
          RUN_FRONTEND_TESTS: ${{ inputs.run-frontend-tests }}
          RUN_BACKEND_TESTS: ${{ inputs.run-backend-tests }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = JSON.parse(process.env.RELEASE_JOB_RESULTS);
          const hotfix = process.env.HOTFIX === 'true';
          if (jobs['release-mode']?.result !== 'success') throw new Error('RELEASE_GATE_FAILED_release-mode');
          const nightly = process.env.RUN_NIGHTLY_SUITES === 'true';
          const required = nightly ? (hotfix ? ['lint','unit','build'] : ['lint','unit','contracts','build']) : ['build'];
          if (nightly && !hotfix && process.env.RUN_FRONTEND_TESTS === 'true') {
            required.push('react');
            if (process.env.RUN_NIGHTLY_SUITES === 'true') required.push('fast-browser','foundation','functional','compiled','timing','performance','lighthouse');
          }
          if (nightly && !hotfix && process.env.RUN_BACKEND_TESTS === 'true') required.push('database');
          for (const name of required) {
            if (jobs[name]?.result !== 'success') throw new Error(`RELEASE_GATE_FAILED_${name}`);
          }
          if (!/^[a-f0-9]{64}$/.test(jobs.build.outputs.digest || '')) throw new Error('RELEASE_DIGEST_MISSING');
          console.log(nightly ? 'Every selected nightly lane passed.' : 'Exact-commit static artifact built and sealed for publication.');
          NODE
      - name: Record the passing immutable candidate
        env:
          HOTFIX: ${{ needs.release-mode.outputs.hotfix }}
          RELEASE_DIGEST: ${{ needs.build.outputs.digest }}
          RELEASE_SITE_ID: ${{ needs.build.outputs.artifact-id }}
          RUN_NIGHTLY_SUITES: ${{ inputs.run-nightly-suites }}
          RUN_SCHEMA_TESTS: ${{ inputs.run-schema-tests }}
          RUN_FRONTEND_TESTS: ${{ inputs.run-frontend-tests }}
          RUN_BACKEND_TESTS: ${{ inputs.run-backend-tests }}
        run: |
          mkdir -p proof
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const hotfix = process.env.HOTFIX === 'true';
          fs.writeFileSync('proof/release-proof.json', JSON.stringify({
            schemaVersion:'gnc-release-proof-v1', repository:process.env.GITHUB_REPOSITORY,
            commit:process.env.GITHUB_SHA, runId:Number(process.env.GITHUB_RUN_ID),
            attempt:Number(process.env.GITHUB_RUN_ATTEMPT), siteArtifactId:Number(process.env.RELEASE_SITE_ID),
            digest:process.env.RELEASE_DIGEST,
            hotfix,
            browserMode:hotfix ? 'hotfix-minimal' : process.env.RUN_NIGHTLY_SUITES === 'true' ? 'full' : 'none',
            testScope:{frontend:!hotfix && process.env.RUN_NIGHTLY_SUITES === 'true' && process.env.RUN_FRONTEND_TESTS === 'true', backend:!hotfix && process.env.RUN_NIGHTLY_SUITES === 'true' && process.env.RUN_BACKEND_TESTS === 'true', schema:!hotfix && process.env.RUN_NIGHTLY_SUITES === 'true' && process.env.RUN_SCHEMA_TESTS === 'true'}
          }));
          NODE
      - uses: actions/checkout@v4
        with:
          path: candidate-source
          sparse-checkout: |
            package.json
            scripts/deployment-fingerprint-lib.mjs
          sparse-checkout-cone-mode: false
      - name: Bind the release version
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { readExpectedRelease } from './candidate-source/scripts/deployment-fingerprint-lib.mjs';
          const file='proof/release-proof.json', proof=JSON.parse(fs.readFileSync(file));
          proof.release=await readExpectedRelease('candidate-source');
          fs.writeFileSync(file,JSON.stringify(proof));
          NODE
      - id: proof
        uses: actions/upload-artifact@v4
        with:
          name: release-proof-${{ github.sha }}-${{ github.run_attempt }}
          path: proof/release-proof.json
          if-no-files-found: error
          retention-days: 7
