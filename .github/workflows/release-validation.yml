          browsers: ${{ matrix.browsers }}
      - uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.build.outputs.digest }}
      - name: Compiled shell — ${{ matrix.suite }}
        if: matrix.suite != 'command-center'
        run: npx playwright test --config ${{ matrix.config }} --workers=1 --reporter=github,blob --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.total }} --max-failures=1
      - name: AURA command center browser interactions
        if: matrix.suite == 'command-center'
        run: node scripts/run-discovered-tests.mjs node-browser
      - name: Verify tests did not change the release package
        env:
          EXPECTED_RELEASE_DIGEST: ${{ needs.build.outputs.digest }}
        run: node scripts/release-artifact.mjs verify
