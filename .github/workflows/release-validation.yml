            blob-report
            test-results
            artifacts
          if-no-files-found: ignore

  timing:
    if: inputs.run-frontend-tests && !inputs.fast-pr && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          - project: chromium
            config: playwright.release-timing.config.ts
            browsers: chromium
          - project: firefox
            config: playwright.release-timing.config.ts
            browsers: firefox
          - project: webkit
            config: playwright.release-timing.config.ts
            browsers: webkit
          - project: android
            config: playwright.release-android.config.ts
            browsers: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-tests
        with:
          browsers: ${{ matrix.browsers }}
      - uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.build.outputs.digest }}
      - name: Scroll and throttled startup on a quiet runner
        run: npx playwright test --config ${{ matrix.config }} --workers=1 --project=${{ matrix.project }} --max-failures=1
      - name: Verify isolated preview blocks production requests
        if: matrix.project == 'chromium'
        run: node scripts/check-isolated-preview.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: timing-diagnostics-${{ matrix.project }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore

  performance:
    if: inputs.run-frontend-tests && !inputs.fast-pr && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-browser-tests
        with:
          browsers: chromium
      - uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.build.outputs.digest }}
      - name: Require review for changes to the pinned performance baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-performance-baseline-review.mjs
      - name: Restore immutable reviewed performance baseline
        uses: actions/cache@v4
        with:
          path: .gnc-local/performance-baseline-*/_site
          key: performance-baseline-v1-${{ runner.os }}-${{ hashFiles('performance/baseline.json', 'package-lock.json', 'scripts/build-performance-baseline.mjs') }}
      - name: Build or verify the pinned historical baseline
        run: node scripts/build-performance-baseline.mjs
      - name: Compare cold and warm routes serially on the same runner
        run: node scripts/run-performance-browser.mjs
      - name: Verify benchmark did not mutate the candidate artifact
        env:
          EXPECTED_RELEASE_DIGEST: ${{ needs.build.outputs.digest }}
        run: node scripts/release-artifact.mjs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ github.run_attempt }}
          path: artifacts/performance
          if-no-files-found: error

  lighthouse:
    if: inputs.run-frontend-tests && !inputs.fast-pr && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-tests
        with:
          browsers: chromium
      - name: Prepare static shell for Lighthouse — verify, never rebuild
        uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.build.outputs.digest }}
      - name: Lighthouse on a quiet runner with bounded protocol retry
        run: node scripts/run-release-lighthouse.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-${{ github.run_attempt }}
          path: .lighthouseci*
          include-hidden-files: true
          if-no-files-found: ignore

  production-health:
    if: inputs.production-health
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe production login bridge and Data API
        env:
          PRODUCTION_PROBE_READ_ONLY: '1'
          PRODUCTION_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUEST_DELIVERY_CRON_SECRET: ${{ secrets.REQUEST_DELIVERY_CRON_SECRET }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          REQUIRE_APPS_SCRIPT_HEALTH: '1'
          REQUIRE_BOUNDED_MAINTENANCE: '1'
        run: node scripts/probe-production-auth-health.mjs

  release-gate:
    if: always()
    needs: [lint, unit, database, build, fast-browser, foundation, functional, compiled, timing, performance, lighthouse, production-health]
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ github.run_id }}
      attempt: ${{ github.run_attempt }}
      site-id: ${{ needs.build.outputs.artifact-id }}
      proof-id: ${{ steps.proof.outputs.artifact-id }}
      digest: ${{ needs.build.outputs.digest }}
    steps:
      - name: Require every safety lane for this commit
        env:
          RELEASE_JOB_RESULTS: ${{ toJSON(needs) }}
          REQUIRE_PRODUCTION_HEALTH: ${{ inputs.production-health }}
          FAST_PR: ${{ inputs.fast-pr }}
          RUN_SCHEMA_TESTS: ${{ inputs.run-schema-tests }}
          RUN_FRONTEND_TESTS: ${{ inputs.run-frontend-tests }}
          RUN_BACKEND_TESTS: ${{ inputs.run-backend-tests }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = JSON.parse(process.env.RELEASE_JOB_RESULTS);
          const required = ['lint','unit','build'];
          if (process.env.RUN_FRONTEND_TESTS === 'true') {
            if (process.env.FAST_PR === 'true') required.push('fast-browser');
            else required.push('foundation','functional','compiled','timing','performance','lighthouse');
          }
          if (process.env.RUN_BACKEND_TESTS === 'true') required.push('database');
          if (process.env.REQUIRE_PRODUCTION_HEALTH === 'true') required.push('production-health');
          for (const name of required) {
            if (jobs[name]?.result !== 'success') throw new Error(`RELEASE_GATE_FAILED_${name}`);
          }
          if (!/^[a-f0-9]{64}$/.test(jobs.build.outputs.digest || '')) throw new Error('RELEASE_DIGEST_MISSING');
          console.log('Every required lane passed for the sealed release.');
          NODE
      - name: Record the passing immutable candidate
        env:
          RELEASE_DIGEST: ${{ needs.build.outputs.digest }}
          RELEASE_SITE_ID: ${{ needs.build.outputs.artifact-id }}
          FAST_PR: ${{ inputs.fast-pr }}
          RUN_SCHEMA_TESTS: ${{ inputs.run-schema-tests }}
          RUN_FRONTEND_TESTS: ${{ inputs.run-frontend-tests }}
          RUN_BACKEND_TESTS: ${{ inputs.run-backend-tests }}
        run: |
          mkdir -p proof
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('proof/release-proof.json', JSON.stringify({
            schemaVersion:'gnc-release-proof-v1', repository:process.env.GITHUB_REPOSITORY,
            commit:process.env.GITHUB_SHA, runId:Number(process.env.GITHUB_RUN_ID),
            attempt:Number(process.env.GITHUB_RUN_ATTEMPT), siteArtifactId:Number(process.env.RELEASE_SITE_ID),
            digest:process.env.RELEASE_DIGEST,
            browserMode:process.env.FAST_PR === 'true' ? 'pr-chromium' : 'full',
            testScope:{frontend:process.env.RUN_FRONTEND_TESTS === 'true', backend:process.env.RUN_BACKEND_TESTS === 'true', schema:process.env.RUN_SCHEMA_TESTS === 'true'}
          }));
          NODE
      - uses: actions/checkout@v4
        with:
          path: candidate-source
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - name: Bind the release version
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='proof/release-proof.json', proof=JSON.parse(fs.readFileSync(file));
          proof.release='V'+JSON.parse(fs.readFileSync('candidate-source/package.json')).version;
          fs.writeFileSync(file,JSON.stringify(proof));
          NODE
      - id: proof
        uses: actions/upload-artifact@v4
        with:
          name: release-proof-${{ github.sha }}-${{ github.run_attempt }}
          path: proof/release-proof.json
          if-no-files-found: error
          retention-days: 7
