name: Validate one immutable release

on:
  push:
    branches:
      - staging
  workflow_call:
    inputs:
      hotfix:
        description: Exact [hotfix] marker detected by the caller.
        type: boolean
        default: false
      fast-pr:
        description: Deprecated compatibility input; browsers run only with run-nightly-suites on main.
        type: boolean
        default: false
      run-nightly-suites:
        description: Run the full frontend, backend, browser, and performance checks from Nightly Validation.
        type: boolean
        default: false
      run-schema-tests:
        type: boolean
        default: false
      production-health:
        type: boolean
        default: false
      run-frontend-tests:
        type: boolean
        default: true
      run-backend-tests:
        type: boolean
        default: true
    outputs:
      digest:
        description: Verified release manifest SHA256
        value: ${{ jobs.build.outputs.digest }}
      run-id:
        description: Workflow run containing the validated release artifacts
        value: ${{ jobs.release-gate.outputs.run-id }}
      attempt:
        description: Validated workflow run attempt
        value: ${{ jobs.release-gate.outputs.attempt }}
      site-id:
        description: Validated site artifact ID
        value: ${{ jobs.release-gate.outputs.site-id }}
      proof-id:
        description: Validated proof artifact ID
        value: ${{ jobs.release-gate.outputs.proof-id }}

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      hotfix: ${{ steps.detect.outputs.hotfix }}
    steps:
      - name: Detect exact hotfix marker
        id: detect
        uses: actions/github-script@v7
        env:
          CALLER_HOTFIX: ${{ inputs.hotfix }}
          RUN_NIGHTLY_SUITES: ${{ inputs.run-nightly-suites }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const nightly = process.env.RUN_NIGHTLY_SUITES === 'true';
            let hotfix = !nightly && (process.env.CALLER_HOTFIX === 'true'
              || String(pr?.title || '').includes('[hotfix]'));
            if (!hotfix && !nightly) {
              const { data: commit } = await github.rest.repos.getCommit({
                ...context.repo, ref: pr?.head?.sha || context.sha,
              });
              hotfix = String(commit.commit?.message || '').includes('[hotfix]');
            }
            if (!hotfix && !nightly && !pr && context.ref === 'refs/heads/main') {
              const { data: associated } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...context.repo, commit_sha: context.sha, per_page: 100,
              });
              hotfix = associated.some(pull => pull.merge_commit_sha === context.sha
                && pull.merged_at && pull.base?.ref === 'main'
                && pull.base?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`
                && String(pull.title || '').includes('[hotfix]'));
            }
            core.setOutput('hotfix', String(hotfix));
      - name: Select hotfix validation
        if: steps.detect.outputs.hotfix == 'true'
        run: echo 'HOTFIX_VALIDATION_SELECTED'

  lint:
    if: inputs.run-nightly-suites && github.ref == 'refs/heads/main' && github.workflow == 'Nightly Validation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-dependencies
      - run: node scripts/prepare-release-version.mjs --check
      - run: npm run check:inline
        if: inputs.run-frontend-tests
      - run: npm run check:tooling

  unit:
    if: inputs.run-nightly-suites && github.ref == 'refs/heads/main' && github.workflow == 'Nightly Validation'
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-dependencies
      - run: node scripts/run-release-unit-checks.mjs --shard=${{ matrix.shard }}/4

  react:
    needs: release-mode
    if: inputs.run-nightly-suites && github.ref == 'refs/heads/main' && github.workflow == 'Nightly Validation' && needs.release-mode.outputs.hotfix != 'true' && inputs.run-frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-dependencies
      - run: node scripts/run-release-react-checks.mjs

  contracts:
    needs: release-mode
    if: inputs.run-nightly-suites && github.ref == 'refs/heads/main' && github.workflow == 'Nightly Validation' && needs.release-mode.outputs.hotfix != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-dependencies
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node scripts/run-discovered-tests.mjs python

  database:
    needs: release-mode
    if: inputs.run-nightly-suites && github.ref == 'refs/heads/main' && github.workflow == 'Nightly Validation' && needs.release-mode.outputs.hotfix != 'true' && inputs.run-backend-tests
    uses: ./.github/workflows/release-database.yml
    with:
      run-schema-tests: ${{ inputs.run-schema-tests }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      digest: ${{ steps.seal.outputs.digest }}
      artifact-id: ${{ steps.site.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-dependencies
      - run: npm run check:inline
      - run: node scripts/run-tooling-release-checks.mjs
      - name: Type-check changed Edge Functions on staging pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync, spawnSync } from 'node:child_process';
          import { existsSync } from 'node:fs';
          import path from 'node:path';
          const base = process.env.BASE_SHA || '';
          let files = /^0+$/.test(base)
            ? execFileSync('git', ['ls-tree', '-r', '--name-only', 'HEAD', 'supabase/functions'], { encoding: 'utf8' }).split(/\r?\n/)
            : execFileSync('git', ['diff', '--name-only', base, 'HEAD', '--', 'supabase/functions'], { encoding: 'utf8' }).split(/\r?\n/);
          if (files.some(file => file.startsWith('supabase/functions/_shared/'))) {
            files = execFileSync('git', ['ls-tree', '-r', '--name-only', 'HEAD', 'supabase/functions'], { encoding: 'utf8' }).split(/\r?\n/);
          }
          const names = [...new Set(files.map(file => /^supabase\/functions\/([^/]+)\//.exec(file)?.[1])
            .filter(name => name && name !== '_shared' && existsSync(path.join('supabase', 'functions', name, 'index.ts'))))].sort();
          for (const name of names) {
            if (!/^[a-z][a-z0-9-]*$/.test(name)) throw new Error('RELEASE_EDGE_NAME_INVALID');
            const result = spawnSync('./node_modules/.bin/deno', ['check', '--node-modules-dir=none', '--frozen',
              `supabase/functions/${name}/index.ts`], { stdio: 'inherit' });
            if (result.error || result.status !== 0) throw new Error(`RELEASE_DENO_CHECK_FAILED_${name}`);
          }
          console.log(`Checked ${names.length} changed Edge Functions.`);
          NODE
      - uses: ./.github/actions/prepare-native-release
      - id: seal
        run: node scripts/release-artifact.mjs seal
      - id: site
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref == 'refs/heads/staging' && github.event_name == 'push' && 'staging-site' || 'release-site' }}-${{ github.sha }}
          path: _site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  fast-browser:
    if: needs.release-mode.outputs.hotfix != 'true' && inputs.run-frontend-tests && inputs.run-nightly-suites && github.ref == 'refs/heads/main' && github.workflow == 'Nightly Validation'
    needs: [build, release-mode]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-tests
        with:
          browsers: chromium
      - uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.build.outputs.digest }}
      - name: Single headless Chromium nightly gate
        run: npx playwright test --config playwright.release-functional.config.ts --project=chromium --workers=2 --max-failures=1 --reporter=github
      - name: Verify the sealed package after the nightly gate
        env:
          EXPECTED_RELEASE_DIGEST: ${{ needs.build.outputs.digest }}
        run: node scripts/release-artifact.mjs verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nightly-chromium-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore

  foundation:
    if: needs.release-mode.outputs.hotfix != 'true' && inputs.run-frontend-tests && inputs.run-nightly-suites && github.ref == 'refs/heads/main' && github.workflow == 'Nightly Validation'
    needs: [build, release-mode]
    runs-on: ubuntu-latest
    # Browser dependency installation can consume over eight minutes on a cold runner.
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - project: lifecycle-chromium
            browsers: chromium
          - project: lifecycle-iphone
            browsers: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-tests
        with:
          browsers: ${{ matrix.browsers }}
      - uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.build.outputs.digest }}
      - name: Shared lifecycle fault injection
        run: npm run test:foundation -- --project=${{ matrix.project }} --max-failures=1 --reporter=github
      - name: Verify immutable package after foundation checks
        env:
          EXPECTED_RELEASE_DIGEST: ${{ needs.build.outputs.digest }}
        run: node scripts/release-artifact.mjs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-${{ matrix.project }}-${{ github.run_attempt }}
          path: test-results/lifecycle
          if-no-files-found: ignore

  functional:
    if: needs.release-mode.outputs.hotfix != 'true' && inputs.run-frontend-tests && inputs.run-nightly-suites && github.ref == 'refs/heads/main' && github.workflow == 'Nightly Validation'
    needs: [build, release-mode]
    runs-on: ubuntu-latest
    # A cold browser install can leave too little of a 15-minute job for the shard.
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        project:
          - chromium
          - firefox
          - webkit
        shard:
          - 1
          - 2
          - 3
          - 4
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-tests
        with:
          browsers: ${{ matrix.project }}
      - uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.build.outputs.digest }}
      - name: Functional browsers, shard ${{ matrix.shard }} of 4
        run: npx playwright test --config playwright.release-functional.config.ts --workers=1 --shard=${{ matrix.shard }}/4 --project=${{ matrix.project }} --max-failures=1 --reporter=github,blob
      - name: Verify tests did not change the release package
        env:
          EXPECTED_RELEASE_DIGEST: ${{ needs.build.outputs.digest }}
        run: node scripts/release-artifact.mjs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-${{ matrix.project }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            blob-report
            test-results
          if-no-files-found: ignore

  compiled:
    if: needs.release-mode.outputs.hotfix != 'true' && inputs.run-frontend-tests && inputs.run-nightly-suites && github.ref == 'refs/heads/main' && github.workflow == 'Nightly Validation'
