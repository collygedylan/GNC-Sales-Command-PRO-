name: Validate one immutable release

on:
  workflow_call:
    inputs:
      production-health:
        type: boolean
        default: false
    outputs:
      digest:
        description: Verified release manifest SHA256
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  actions: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-release-version.mjs --check
      - run: npm run check:inline
      - run: node scripts/run-release-unit-checks.mjs
      - run: npm run test:v2

  database:
    uses: ./.github/workflows/release-database.yml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      digest: ${{ steps.seal.outputs.digest }}
      artifact-id: ${{ steps.site.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pilot-monitoring
      - run: npm run build:live:assets
      - run: npm run build:v2
      - run: node scripts/prepare-release-site.mjs
      - id: seal
        run: node scripts/release-artifact.mjs seal
      - id: site
        uses: actions/upload-artifact@v4
        with:
          name: release-site-${{ github.sha }}
          path: _site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  functional:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-tests
      - uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.build.outputs.digest }}
      - name: Functional browsers, shard ${{ matrix.shard }} of 4
        run: npx playwright test --config playwright.release-functional.config.ts --workers=1 --shard=${{ matrix.shard }}/4 --reporter=github,blob
      - name: Verify tests did not change the release package
        env:
          EXPECTED_RELEASE_DIGEST: ${{ needs.build.outputs.digest }}
        run: node scripts/release-artifact.mjs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            blob-report
            test-results
          if-no-files-found: ignore

  compiled:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - suite: footer
            config: playwright.footer.config.ts
          - suite: home-1
            config: playwright.home-role.config.ts
            shard: 1/2
          - suite: home-2
            config: playwright.home-role.config.ts
            shard: 2/2
          - suite: season
            config: playwright.season-sales-office.config.ts
          - suite: suspend
            config: playwright.suspend-tag.config.ts
          - suite: docks
            config: playwright.docks-filter.config.ts
          - suite: av-blanks
            config: playwright.task-av-blanks.config.ts
          - suite: session
            config: playwright.session-recovery.config.ts
          - suite: assignedto
            config: playwright.review-assignedto.config.ts
          - suite: verified-cache
            config: playwright.verified-data-cache.config.ts
          - suite: request-reliability
            config: playwright.request-reliability.config.ts
          - suite: request-photo
            config: playwright.request-photo.config.ts
          - suite: bunch-note
            config: playwright.bunch-note.config.ts
          - suite: hl-order-1
            config: playwright.hl-order.config.ts
            shard: 1/3
          - suite: hl-order-2
            config: playwright.hl-order.config.ts
            shard: 2/3
          - suite: hl-order-3
            config: playwright.hl-order.config.ts
            shard: 3/3
          - suite: hl-restock
            config: playwright.hl-restock.config.ts
          - suite: stable-refresh
            config: playwright.stable-background-refresh.config.ts
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-tests
      - uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.build.outputs.digest }}
      - name: Compiled shell — ${{ matrix.suite }}
        run: npx playwright test --config ${{ matrix.config }} --workers=1 --reporter=github,blob ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}
      - name: Verify tests did not change the release package
        env:
          EXPECTED_RELEASE_DIGEST: ${{ needs.build.outputs.digest }}
        run: node scripts/release-artifact.mjs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiled-${{ matrix.suite }}-${{ github.run_attempt }}
          path: |
            blob-report
            test-results
            artifacts
          if-no-files-found: ignore

  timing:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-tests
      - uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.build.outputs.digest }}
      - name: Scroll and throttled startup on a quiet runner
        run: npx playwright test --config playwright.release-timing.config.ts --workers=1
      - name: Android startup and protected photo persistence
        run: npx playwright test --config playwright.release-android.config.ts --project=android --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: timing-diagnostics-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-tests
        with:
          browsers: chromium
      - name: Prepare static shell for Lighthouse — verify, never rebuild
        uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.build.outputs.digest }}
      - name: Lighthouse on a quiet runner with bounded protocol retry
        run: node scripts/run-release-lighthouse.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-${{ github.run_attempt }}
          path: .lighthouseci*
          include-hidden-files: true
          if-no-files-found: ignore

  production-health:
    if: inputs.production-health
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe production login bridge and Data API
        env:
          PRODUCTION_PROBE_READ_ONLY: '1'
          PRODUCTION_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUEST_DELIVERY_CRON_SECRET: ${{ secrets.REQUEST_DELIVERY_CRON_SECRET }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          REQUIRE_APPS_SCRIPT_HEALTH: '1'
          REQUIRE_BOUNDED_MAINTENANCE: '1'
        run: node scripts/probe-production-auth-health.mjs

  release-gate:
    if: always()
    needs: [unit, database, build, functional, compiled, timing, lighthouse, production-health]
    runs-on: ubuntu-latest
    steps:
      - name: Require every safety lane for this commit
        env:
          RELEASE_JOB_RESULTS: ${{ toJSON(needs) }}
          REQUIRE_PRODUCTION_HEALTH: ${{ inputs.production-health }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = JSON.parse(process.env.RELEASE_JOB_RESULTS);
          const required = ['unit','database','build','functional','compiled','timing','lighthouse'];
          if (process.env.REQUIRE_PRODUCTION_HEALTH === 'true') required.push('production-health');
          for (const name of required) {
            if (jobs[name]?.result !== 'success') throw new Error(`RELEASE_GATE_FAILED_${name}`);
          }
          if (!/^[a-f0-9]{64}$/.test(jobs.build.outputs.digest || '')) throw new Error('RELEASE_DIGEST_MISSING');
          console.log('Every required lane passed for the sealed release.');
          NODE
      - name: Record the passing immutable candidate
        env:
          RELEASE_DIGEST: ${{ needs.build.outputs.digest }}
          RELEASE_SITE_ID: ${{ needs.build.outputs.artifact-id }}
        run: |
          mkdir -p proof
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('proof/release-proof.json', JSON.stringify({
            schemaVersion:'gnc-release-proof-v1', repository:process.env.GITHUB_REPOSITORY,
            commit:process.env.GITHUB_SHA, runId:Number(process.env.GITHUB_RUN_ID),
            attempt:Number(process.env.GITHUB_RUN_ATTEMPT), siteArtifactId:Number(process.env.RELEASE_SITE_ID),
            digest:process.env.RELEASE_DIGEST
          }));
          NODE
      - uses: actions/checkout@v4
        with:
          path: candidate-source
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - name: Bind the release version
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='proof/release-proof.json', proof=JSON.parse(fs.readFileSync(file));
          proof.release='V'+JSON.parse(fs.readFileSync('candidate-source/package.json')).version;
          fs.writeFileSync(file,JSON.stringify(proof));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: release-proof-${{ github.sha }}-${{ github.run_attempt }}
          path: proof/release-proof.json
          if-no-files-found: error
          retention-days: 7
