name: Validate one immutable release

on:
  workflow_call:
    inputs:
      production-health:
        type: boolean
        default: false
    outputs:
      digest:
        description: Verified release manifest SHA256
        value: ${{ jobs.build.outputs.digest }}
      run-id:
        description: Workflow run containing the validated release artifacts
        value: ${{ jobs.release-gate.outputs.run-id }}
      attempt:
        description: Validated workflow run attempt
        value: ${{ jobs.release-gate.outputs.attempt }}
      site-id:
        description: Validated site artifact ID
        value: ${{ jobs.release-gate.outputs.site-id }}
      proof-id:
        description: Validated proof artifact ID
        value: ${{ jobs.release-gate.outputs.proof-id }}

permissions:
  contents: read
  actions: read

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-dependencies
      - run: node scripts/prepare-release-version.mjs --check
      - run: npm run check:inline
      - run: npm run check:tooling
      - run: node scripts/run-release-unit-checks.mjs
      - run: npm run test:v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node scripts/run-discovered-tests.mjs python

  database:
    uses: ./.github/workflows/release-database.yml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      digest: ${{ steps.seal.outputs.digest }}
      artifact-id: ${{ steps.site.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-dependencies
      - run: npm run build:pilot-monitoring
      - run: npm run build:live:assets
      - run: npm run build:v2
      - run: node scripts/prepare-release-site.mjs
      - id: seal
        run: node scripts/release-artifact.mjs seal
      - id: site
        uses: actions/upload-artifact@v4
        with:
          name: release-site-${{ github.sha }}
          path: _site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  foundation:
    needs: build
    runs-on: ubuntu-latest
    # Browser dependency installation can consume over eight minutes on a cold runner.
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - project: lifecycle-chromium
            browsers: chromium
          - project: lifecycle-iphone
            browsers: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-tests
        with:
          browsers: ${{ matrix.browsers }}
      - uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.build.outputs.digest }}
      - name: Shared lifecycle fault injection before feature suites
        run: npm run test:foundation -- --project=${{ matrix.project }} --max-failures=1 --reporter=github
      - name: Verify immutable package after foundation checks
        env:
          EXPECTED_RELEASE_DIGEST: ${{ needs.build.outputs.digest }}
        run: node scripts/release-artifact.mjs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-${{ matrix.project }}-${{ github.run_attempt }}
          path: test-results/lifecycle
          if-no-files-found: ignore

  functional:
    needs: [build, foundation]
    runs-on: ubuntu-latest
    # A cold browser install can leave too little of a 15-minute job for the shard.
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        project:
          - chromium
          - firefox
          - webkit
        shard:
          - 1
          - 2
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-tests
        with:
          browsers: ${{ matrix.project }}
      - uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.build.outputs.digest }}
      - name: Functional browsers, shard ${{ matrix.shard }} of 2
        run: npx playwright test --config playwright.release-functional.config.ts --workers=1 --shard=${{ matrix.shard }}/2 --project=${{ matrix.project }} --max-failures=1 --reporter=github,blob
      - name: Verify tests did not change the release package
        env:
          EXPECTED_RELEASE_DIGEST: ${{ needs.build.outputs.digest }}
        run: node scripts/release-artifact.mjs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-${{ matrix.project }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            blob-report
            test-results
          if-no-files-found: ignore

  compiled:
    needs: [build, foundation]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - suite: production-requests
            config: playwright.release-canary.config.ts
            project: production-chromium
            browsers: chromium
            shard: 1
            total: 1
          - suite: production-requests
