name: Live dataset revision transactions and native Realtime
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'database/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-dataset-revisions-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database-path-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm actual Supabase or database path changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              ;;
            workflow_dispatch)
              base="${CURRENT_SHA}^1"
              head="$CURRENT_SHA"
              ;;
            *)
              echo "Unsupported event for database path comparison: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [[ -z "$base" || -z "$head" ]]; then
            echo 'DATABASE_PATH_COMPARISON_FAILED: missing range endpoint' >&2
            exit 1
          fi
          if ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1 || ! git rev-parse --verify "$head^{commit}" >/dev/null 2>&1; then
            echo 'DATABASE_PATH_COMPARISON_FAILED: endpoint unavailable' >&2
            exit 1
          fi
          diff_file="$RUNNER_TEMP/database-paths.nul"
          if ! git diff --name-only --no-renames -z --diff-filter=ACMRD "$base" "$head" > "$diff_file"; then
            echo 'DATABASE_PATH_COMPARISON_FAILED: git diff failed' >&2
            exit 1
          fi
          mapfile -d '' -t changed_files < "$diff_file"
          changed=false
          for changed_file in "${changed_files[@]}"; do
            case "$changed_file" in
              supabase/*|database/*) changed=true ;;
            esac
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  isolated-native-revisions:
    needs: database-path-scope
    if: needs.database-path-scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: '2.111.0'
      - uses: ./.github/actions/setup-node-dependencies
      - run: node scripts/run-discovered-tests.mjs node-ci-integration
      - name: Start disposable local Auth, REST and Realtime only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agmetric-revisions-ci-local"
          supabase init --workdir "$RUNNER_TEMP/agmetric-revisions-ci-local"
          supabase start --workdir "$RUNNER_TEMP/agmetric-revisions-ci-local" --exclude storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor
      - name: Verify transactions, native sessions, two-device WebSockets and quota coalescing
        run: node supabase/ci/live_dataset_revision_realtime.mjs "$RUNNER_TEMP/agmetric-revisions-ci-local"
      - name: Inspect isolated security advisors
        run: supabase db advisors --local --workdir "$RUNNER_TEMP/agmetric-revisions-ci-local" --type security --level error --fail-on error
      - name: Diagnose local Realtime only on failure
        if: failure()
        run: docker logs --tail 150 supabase_realtime_agmetric-revisions-ci-local
      - name: Stop disposable local environment
        if: always()
        run: supabase stop --workdir "$RUNNER_TEMP/agmetric-revisions-ci-local"
