name: Nightly Validation

on:
  schedule:
    # GitHub cron is UTC-only. Run at both possible UTC times for 8:30 PM
    # America/Chicago, then use central-time-gate to keep only the local match.
    - cron: '30 1,2 * * *'
  workflow_dispatch:
    inputs:
      full_regression:
        description: Explicitly run all browser, SQL, import and historical Node suites.
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: nightly-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  central-time-gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Allow only the 8:30 PM Central scheduled run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_REGRESSION: ${{ inputs.full_regression }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "should_run=$FULL_REGRESSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          central_hour="$(TZ=America/Chicago date +%H)"
          if [[ "$central_hour" == "20" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Ignoring the alternate UTC schedule; current Central hour is $central_hour."
          fi

  expanded-validation:
    needs: central-time-gate
    if: github.ref == 'refs/heads/main' && needs.central-time-gate.outputs.should_run == 'true'
    uses: ./.github/workflows/release-validation.yml
    with:
      hotfix: false
      fast-pr: false
      run-nightly-suites: true
      run-schema-tests: false
      production-health: false
      run-frontend-tests: true
      run-backend-tests: false
    secrets: inherit

  release-smoke:
    needs: [central-time-gate, expanded-validation]
    if: github.ref == 'refs/heads/main' && needs.central-time-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-tests
        with:
          browsers: chromium webkit
      - uses: ./.github/actions/download-release
        with:
          digest: ${{ needs.expanded-validation.outputs.digest }}
      - name: Three-profile release smoke (Nightly only)
        env:
          RELEASE_SMOKE_SITE_DIR: _site
          EXPECTED_RELEASE_COMMIT: ${{ github.sha }}
          EXPECTED_RELEASE_DIGEST: ${{ needs.expanded-validation.outputs.digest }}
        run: node scripts/run-release-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-release-smoke-${{ github.run_id }}
          path: .gnc-local/release-smoke
          include-hidden-files: true
          if-no-files-found: ignore

  backend-diagnostics:
    needs: central-time-gate
    if: github.ref == 'refs/heads/main' && needs.central-time-gate.outputs.should_run == 'true'
    uses: ./.github/workflows/release-database.yml
    with:
      run-schema-tests: true
      run-browser-tests: true
      run-performance-tests: true
      run-all-schema-tests: true

  pending-order-contract:
    needs: central-time-gate
    if: github.ref == 'refs/heads/main' && needs.central-time-gate.outputs.should_run == 'true'
    uses: ./.github/workflows/bloomscapes-pending-tests.yml
    with:
      run-nightly-suites: true

  suspend-tag-contract:
    needs: central-time-gate
    if: github.ref == 'refs/heads/main' && needs.central-time-gate.outputs.should_run == 'true'
    uses: ./.github/workflows/suspend-tag-tests.yml
    with:
      run-nightly-suites: true

  live-dataset-contract:
    needs: central-time-gate
    if: github.ref == 'refs/heads/main' && needs.central-time-gate.outputs.should_run == 'true'
    uses: ./.github/workflows/live-dataset-revisions.yml
    with:
      run-nightly-suites: true

  current-live-release:
    needs: central-time-gate
    if: github.ref == 'refs/heads/main' && needs.central-time-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-dependencies
      - name: Resolve the actual frontend publication
        id: live-baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_BASELINE_PUBLICATION: frontend
          RELEASE_BASELINE_INCLUDE_CURRENT: 'true'
        run: node scripts/release-baseline.mjs
      - name: Wait for the published frontend commit to be live
        env:
          EXPECTED_COMMIT: ${{ steps.live-baseline.outputs.commit }}
          CANARY_BASE_URL: https://agmetricapp.com
          REQUIRE_CURRENT_LIVE_DESCRIPTOR: '1'
          CANARY_WAIT_TIMEOUT_MS: '600000'
          CANARY_WAIT_INTERVAL_MS: '5000'
        run: node scripts/wait-for-live-release.mjs

  post-deployment-canary:
    needs: [central-time-gate, current-live-release]
    if: github.ref == 'refs/heads/main' && needs.central-time-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: true
      matrix:
        include:
          - suite: foundation
            project: lifecycle-chromium
            browsers: chromium
            command: 'npm run test:foundation -- --reporter=github --project=lifecycle-chromium --workers=1 --max-failures=1'
          - suite: foundation
            project: lifecycle-iphone
            browsers: webkit
            command: 'npm run test:foundation -- --reporter=github --project=lifecycle-iphone --workers=1 --max-failures=1'
          - suite: requests
            project: production-chromium
            browsers: chromium
            command: npx playwright test --config playwright.production.config.ts --project=production-chromium --workers=1 --max-failures=1
          - suite: requests
            project: production-iphone-webkit
            browsers: webkit
            command: npx playwright test --config playwright.production.config.ts --project=production-iphone-webkit --workers=1 --max-failures=1
          - suite: session
            project: session-chromium
            browsers: chromium
            command: 'npm run test:session-recovery -- --project=session-chromium --workers=1 --max-failures=1'
          - suite: session
            project: session-iphone
            browsers: webkit
            command: 'npm run test:session-recovery -- --project=session-iphone --workers=1 --max-failures=1'
          - suite: login-photo
            project: chromium
            browsers: chromium
            command: npx playwright test --config playwright.login-photo.config.ts --project=chromium --workers=1 --max-failures=1
          - suite: login-photo
            project: webkit
            browsers: webkit
            command: npx playwright test --config playwright.login-photo.config.ts --project=webkit --workers=1 --max-failures=1
          - suite: login-photo
            project: android
            browsers: chromium
            command: npx playwright test --config playwright.login-photo.config.ts --project=android --workers=1 --max-failures=1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-tests
        with:
          browsers: ${{ matrix.browsers }}
      - name: Mutation-blocked live ${{ matrix.suite }} checks
        env:
          CANARY_BASE_URL: https://agmetricapp.com
          EXPECTED_COMMIT: ${{ github.sha }}
          APP_LIFECYCLE_BASE_URL: https://agmetricapp.com
          SESSION_RECOVERY_BASE_URL: https://agmetricapp.com
          LOGIN_PHOTO_BASE_URL: https://agmetricapp.com
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-${{ matrix.suite }}-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
            artifacts
          if-no-files-found: ignore
          retention-days: 7

  compile-and-email-report:
    needs:
      - central-time-gate
      - expanded-validation
      - backend-diagnostics
      - release-smoke
      - pending-order-contract
      - suspend-tag-contract
      - live-dataset-contract
      - current-live-release
      - post-deployment-canary
    if: always() && github.ref == 'refs/heads/main' && needs.central-time-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Compile validation results into a text report
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          EXPANDED_VALIDATION_RESULT: ${{ needs.expanded-validation.result }}
          RELEASE_SMOKE_RESULT: ${{ needs.release-smoke.result }}
          BACKEND_DIAGNOSTICS_RESULT: ${{ needs.backend-diagnostics.result }}
          PENDING_ORDER_CONTRACT_RESULT: ${{ needs.pending-order-contract.result }}
          SUSPEND_TAG_CONTRACT_RESULT: ${{ needs.suspend-tag-contract.result }}
          LIVE_DATASET_CONTRACT_RESULT: ${{ needs.live-dataset-contract.result }}
          CURRENT_LIVE_RELEASE_RESULT: ${{ needs.current-live-release.result }}
          POST_DEPLOYMENT_CANARY_RESULT: ${{ needs.post-deployment-canary.result }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          async function main() {
            const headers = {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28',
            };
            const jobs = [];
            for (let page = 1; ; page += 1) {
              const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.RUN_ID}/jobs?per_page=100&page=${page}`;
              const response = await fetch(url, { headers });
              if (!response.ok) throw new Error(`GitHub Actions API returned ${response.status}`);
              const data = await response.json();
              jobs.push(...data.jobs);
              if (data.jobs.length < 100) break;
            }

            const centralNow = new Intl.DateTimeFormat('en-US', {
              timeZone: 'America/Chicago', dateStyle: 'full', timeStyle: 'long',
            }).format(new Date());
            const topLevel = [
              ['Expanded validation (repository tests, layout/browser snapshots, performance benchmarks)', process.env.EXPANDED_VALIDATION_RESULT],
              ['Three-profile release smoke', process.env.RELEASE_SMOKE_RESULT],
              ['Backend diagnostics (database/browser/performance suites)', process.env.BACKEND_DIAGNOSTICS_RESULT],
              ['Pending-order transaction contracts', process.env.PENDING_ORDER_CONTRACT_RESULT],
              ['Suspend Tag transaction contracts', process.env.SUSPEND_TAG_CONTRACT_RESULT],
              ['Live dataset transaction contracts', process.env.LIVE_DATASET_CONTRACT_RESULT],
              ['Current live release verification', process.env.CURRENT_LIVE_RELEASE_RESULT],
              ['Post-deployment canary matrix', process.env.POST_DEPLOYMENT_CANARY_RESULT],
            ];
            const lines = [
              'Nightly Validation Report',
              `Repository: ${process.env.GITHUB_REPOSITORY}`,
              `Commit: ${process.env.COMMIT_SHA}`,
              `Generated: ${centralNow}`,
              `Workflow run: ${process.env.RUN_URL}`,
              '',
              'Validation group outcomes:',
              ...topLevel.map(([name, result]) => `- ${name}: ${result}`),
              '',
              'Detailed test, snapshot, benchmark, and workflow job outcomes:',
            ];

            const relevantStep = /test|snapshot|performance|timing|lighthouse|benchmark|report/i;
            for (const job of jobs) {
              lines.push(`- ${job.name}: ${job.conclusion || job.status}`);
              const steps = (job.steps || []).filter((step) =>
                relevantStep.test(step.name) || (step.conclusion && step.conclusion !== 'success'),
              );
              for (const step of steps) {
                lines.push(`  - ${step.name}: ${step.conclusion || step.status}`);
              }
            }
            if (jobs.length === 0) lines.push('- No job records were returned by the Actions API.');

            const report = `${lines.join('\n')}\n`;
            fs.writeFileSync('nightly-validation-report.txt', report);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n\`\`\`text\n${report}\`\`\`\n`);
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Upload the compiled validation report
        uses: actions/upload-artifact@v4
        with:
          name: nightly-validation-report-${{ github.run_id }}
          path: nightly-validation-report.txt
          if-no-files-found: error
          retention-days: 30
      - name: Email the compiled validation report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || '587' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: Nightly Validation Report — ${{ github.repository }} — ${{ github.run_id }}
          to: dylan_collyge@greenleafnursery.com
          from: ${{ secrets.SMTP_USERNAME }}
          body: file://nightly-validation-report.txt
          attachments: nightly-validation-report.txt
