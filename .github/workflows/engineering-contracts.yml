name: Mandatory engineering contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-dependencies
      - name: Reject engineering regressions against the event base
        run: |
          node scripts/anti-spaghetti-lock.mjs
          node scripts/monolith-growth-lock.mjs
      - name: Prove negative cases and safe counterexamples
        run: node --test tests/anti-spaghetti-lock.test.mjs scripts/monolith-growth-lock.test.mjs scripts/engineering-proof.test.mjs
