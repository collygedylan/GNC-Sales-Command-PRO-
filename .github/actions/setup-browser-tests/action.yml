name: Prepare isolated browser runner
description: Reuse cached dependencies and browsers without sharing ports or output directories across jobs.
inputs:
  browsers:
    description: Space-separated Playwright browsers required by this job.
    default: chromium firefox webkit
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node-dependencies
    - uses: ./.github/actions/setup-playwright
      with:
        browsers: ${{ inputs.browsers }}
