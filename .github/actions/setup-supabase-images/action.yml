name: Restore pinned Supabase container images
description: Cache container image layers only; never persist database volumes or credentials.
outputs:
  cache-hit:
    value: ${{ steps.images.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      id: images
      with:
        path: ${{ runner.temp }}/gnc-supabase-images
        key: supabase-images-v2-${{ runner.os }}-${{ runner.arch }}-cli2.111.0-${{ hashFiles('supabase/config.toml', 'scripts/ci-supabase-image-cache.mjs') }}
    - shell: bash
      run: node scripts/ci-supabase-image-cache.mjs restore
