# GNC defaults for new project sessions; explicit app/session choices take precedence.
# Standard speed is intentionally inherited. Do not enable Fast mode for routine work.
model = "gpt-5.4"
model_reasoning_effort = "high"

[agents]
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-5.4-mini"
default_subagent_reasoning_effort = "medium"
