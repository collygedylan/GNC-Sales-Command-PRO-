<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/assets/historical-requests.css"><style>body{margin:0;padding:16px;font-family:system-ui;background:#f1f5f9}html[data-theme="dark"] body{background:#0f172a}</style></head><body>
<button id="open" type="button">Open Historical Requests</button><div id="root"></div>
<script>
const own = new URLSearchParams(location.search).get('scope') !== 'all';
const repId = '50000000-0000-4000-8000-000000000001';
const repKey = 'rep:' + repId;
const group = (key,label,requestCount,totalValue,unpricedCount=0,extra={}) => ({key,label,requestCount,totalValue:own?null:totalValue,unpricedCount:own?null:unpricedCount,customerKey:null,consigneeKey:null,consigneeName:null,...extra});
const summary = {requestCount:10,totalValue:own?null:4375,unpricedCount:own?null:2};
const base = (query,rows,total=rows.length) => ({scope:own?'own':'all',financials:!own,ownRepKey:repKey,recordKind:query.recordKind||'all',revision:'history-v3:fixture',generatedAt:'2026-10-10T12:00:00Z',page:query.page||0,pageSize:query.pageSize||25,total,rows,summary});
const requestArchivePath = ['Molly Dixon','North Nursery','Direct_or_NA','2026-10-09_REQ-1','00012'];
const orderArchivePath = ['North Nursery','East Yard','Trip 1'];
function archiveRead(query) {
 const selected = query.path || [];
 const request = query.recordKind === 'requests';
 const path = request ? requestArchivePath : orderArchivePath;
 const value = path[selected.length];
 const rows = query.operation === 'archive-folders' && value
  ? [{kind:'folder',key:'folder:'+value,value,label:value,subtitle:'',recordCount:1,totalValue:own?null:3500}]
  : [{kind:'record',id:'40000000-0000-4000-8000-000000000001',title:'Red Maple ®',subtitle:path.join(' / '),status:'Completed',
    occurredAt:'2026-10-09T12:00:00Z',itemcode:'00012',commonname:'Red Maple ®',contsize:'10G',locationcode:'A.01',lotcode:'L1',
    quantity:0,unitListPrice:own?null:140,lineDollarValue:own?null:3500,
    photoLinks:['/assets/branding/ag-data-solutions-icon-v2026080925-192.png'],photoDate:'2026-10-09',
    facts:request?{Spec:'8 feet',Caliper:'2 inches',Sent:'2026-10-09T13:00:00Z',Delivery:'Sent'}:{Dock:'0'},
    notes:['Keep the paired folder'],...(request?{archivePath:path}:{})}];
 return {...base(query,rows),operation:query.operation,path:selected,depth:selected.length,maxDepth:path.length};
}
window.historyFixture={calls:[],async read(query,signal){
 this.calls.push({query,aborted:signal?.aborted||false});
 if(query.operation.startsWith('archive-')) return archiveRead(query);
 if(query.operation==='customers') return base(query,[group('customer:001','North Nursery',2,3500,1),group('customer:002','South Nursery',8,875,1)]);
 if(query.operation==='reps') return base(query,own?[group(repKey,'Molly Dixon',5,1875,1)]:[group(repKey,'Molly Dixon',5,1875,1),group('rep:50000000-0000-4000-8000-000000000002','Kim Lee',5,2500,1)]);
 if(query.operation==='months') return base(query,[group('month:2026-10','October 2026',10,4375,2)]);
 return base(query,[],0);
}};
document.getElementById('open').addEventListener('click',async()=>{const module=await import('/assets/historical-requests.js');document.getElementById('open').hidden=true;
 const bridge=module.createHistoricalRequestsBridge({scopeKey:own?'fixture-rep:own':'fixture-admin:all',role:own?'Sales Rep':'Admin',revisionKey:'r1',transport:(query,signal)=>window.historyFixture.read(query,signal)});
 module.mountHistoricalRequests(document.getElementById('root'),bridge);});
</script></body></html>
